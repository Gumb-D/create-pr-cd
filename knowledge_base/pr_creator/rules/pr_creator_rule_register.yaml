      - AQ-003

  - id: PRC-ELIG-003
    title: Planning PR eligibility and duplicate gate
    domain: eligibility
    knowledge_status: APPROVED
    runtime_status: DOCUMENTED_ONLY
    statement: "For a supported DU Model, a site is Planning-eligible only when Subcon Planning is non-blank and the approved Planning PR status/number field is blank. Blank Planning subcon is ignored. Any non-blank Planning PR status/number prevents regeneration. Unknown non-blank Planning subcon fails closed to REVIEW_REQUIRED."
    inputs:
      - "DU Model"
      - "Subcon Planning / Subcon - Planning"
      - "Subcon PR - Planning / approved equivalent Planning PR status field"
    expected_outcome: "Every requested Planning site reaches one terminal outcome: eligible, ignored/existing, or REVIEW_REQUIRED; no duplicate Planning PR is generated."
    risk: CRITICAL
    source_references:
      - "docs/superpowers/specs/2026-08-11-planning-pr-all-du-design.md"
      - "Info/reference/planning-pr/ (local business evidence; raw exports are not committed)"
    acceptance_question_ids:
      - AQ-025
      - AQ-026
      - AQ-027
      - AQ-030
      - AQ-031
      - AQ-032

  - id: PRC-DUP-001
    title: Duplicate PR prevention
    domain: eligibility
    knowledge_status: EXTRACTED
    runtime_status: ACTIVE
    statement: "Do not generate the same site and scope when a PR number or controlled status already exists; record the skip reason. Planning uses its own approved Subcon PR - Planning/equivalent status field."
    inputs:
      - "Site identifier"
      - "Scope"
      - "Existing PR status / PR number"
    expected_outcome: "The site-scope pair is skipped and traceable in the processing summary."
    risk: CRITICAL
    source_references:
      - "SKILL.md"
      - "README.md"
      - "docs/superpowers/specs/2026-08-11-planning-pr-all-du-design.md"
    acceptance_question_ids:
      - AQ-003
      - AQ-031

  - id: PRC-DATA-001
    title: PBOM canonicalization for matching and duplicate prevention
    domain: data
    knowledge_status: VERIFIED
    runtime_status: ACTIVE
    statement: "Excel integer-like PBOM values such as 350000062773.0 must be canonicalized safely to 350000062773. Canonical PBOM values must be used at model-load, selection, and duplicate-prevention boundaries. Preserve all digits; do not use unsafe trimming or float conversion that can lose precision."
    inputs:
      - "PR Model PBOM Code column (TSS and TI)"
      - "Site-derived material codes used in selection and duplicate checks"
    expected_outcome: "PBOM codes are compared and emitted in one canonical string form with no precision loss and no residual '.0' formatting artifact."
    risk: CRITICAL
    source_references:
      - "scripts/pr_helpers.py"
      - "scripts/generate_tss_pr_ecc.py"
      - "tests/test_mw_reroute.py"
    acceptance_question_ids:
      - AQ-022
      - AQ-023

  - id: PRC-TSS-001
    title: TSS MW New Link / Reroute survey PBOM and quantity selection
    domain: matching
    knowledge_status: VERIFIED
    runtime_status: ACTIVE
    statement: "Survey PBOM selection for MW New Link / Reroute is deterministic. MW New Link uses PBOM 350000062773. MW Reroute uses PBOM 350000062776 only for site IDs containing '_LOS'; otherwise MW Reroute uses 350000062773. PBOM 350000589343 and 350000589344 each appear once per site. Quantity is 1.0 for New Link and 1.5 for Reroute."
    inputs:
      - "Tx SOW"
      - "TX Upgrade Scope"
      - "Site identifier (for LOS detection)"
      - "TSS PR Model rows"
    expected_outcome: "Exactly one survey PBOM is selected per site, controlled quantity items are emitted with the correct quantity, and no PBOM is duplicated in the output."
    risk: CRITICAL
    source_references:
      - "scripts/pr_helpers.py"
      - "tests/test_mw_reroute.py"
    acceptance_question_ids:
      - AQ-023

  - id: PRC-SOW-001
    title: Primary Tx SOW selection
    domain: classification
    knowledge_status: EXTRACTED
    runtime_status: UNKNOWN
    statement: "When multiple SOW keywords occur in Tx SOW, use the first identified SOW keyword and do not generate secondary SOWs. This rule does not apply to Planning PBOM selection."
    inputs:
      - "Tx SOW"
    expected_outcome: "One primary SOW is selected for scopes that use Tx SOW; Planning does not consume Tx SOW for PBOM selection."
    risk: HIGH
    source_references:
      - "SKILL.md"
      - "docs/superpowers/specs/2026-08-11-planning-pr-all-du-design.md"
    acceptance_question_ids:
      - AQ-005
      - AQ-029

  - id: PRC-MODEL-001
    title: TSS PR model matching
    domain: matching
    knowledge_status: EXTRACTED
    runtime_status: PARTIAL
    statement: "Match TSS by primary Tx SOW only; generate mandatory items only. Match mandatory TSS items using the applicable TSS model logic and preserve the model-defined quantity. SOW-specific selection and quantity overrides, including MW New Link / Reroute controls, are governed by PRC-TSS-001."
    inputs:
      - "Primary Tx SOW"
      - "TSS PR Model rows"
    expected_outcome: "An unambiguous mandatory TSS model set is emitted with the model-defined quantity preserved for each item; this is not always quantity 1 where a SOW-specific override such as PRC-TSS-001 applies."
    exception: "Multiple matching models must be REVIEW_REQUIRED."
    risk: HIGH
    source_references:
      - "SKILL.md"
      - "README.md"
    acceptance_question_ids:
      - AQ-006
      - AQ-007

  - id: PRC-MODEL-002
    title: TI PR model matching
    domain: matching
    knowledge_status: VERIFIED
    runtime_status: ACTIVE
    statement: "TI mandatory model matching uses canonical, case-insensitive, whitespace-normalized exact Tx SOW equality. Unsupported substrings or supersets must not match a model; for example, 'BBU Patching Extended' must not match 'BBU Patching'. Antenna-dependent selection is evaluated only after a valid strict TI SOW match; generate mandatory items only; set quantity to 1 per site per matched mandatory item."
    inputs:
      - "Primary Tx SOW"
      - "MW Config Antenna Size NE"
      - "MW Config Antenna Size FE"
      - "TI PR Model rows"
    expected_outcome: "An unambiguous mandatory TI model set is emitted from strict canonical SOW equality; antenna data is consulted only when the matched model requires it."
    exception: "No safe strict SOW match or multiple matching model groups must be REVIEW_REQUIRED."
    risk: CRITICAL
    source_references:
      - "VALIDATION_REPORT.md"
      - "scripts/pr_helpers.py"
      - "scripts/generate_tss_pr_ecc.py"
      - "README.md"
      - "tests/test_ti_sow_matching.py"
    acceptance_question_ids:
      - AQ-008
      - AQ-009
      - AQ-010
      - AQ-021

  - id: PRC-ANT-001
    title: TI antenna size selection
    domain: classification
    knowledge_status: VERIFIED
    runtime_status: ACTIVE
    statement: "Antenna input is required only when the strictly matched mandatory TI model contains an antenna-dependent choose-one group. For antenna-independent SOWs such as 'BBU Patching' and 'MW IDU Patching', blank or one-sided antenna input must not block valid ECC generation. For antenna-dependent models, where NE and FE sizes are both present use the larger normalized size; incomplete NE/FE data remains REVIEW_REQUIRED."
    inputs:
      - "Primary Tx SOW"
      - "MW Config Antenna Size NE"
      - "MW Config Antenna Size FE"
    expected_outcome: "A chosen size and category are produced only when the matched model is antenna-dependent, with a traceable review state for incomplete data on those models. Antenna-independent models generate normally regardless of antenna input."
    risk: CRITICAL
    source_references:
      - "VALIDATION_REPORT.md"
      - "scripts/generate_tss_pr_ecc.py"
      - "tests/test_ti_sow_matching.py"
    acceptance_question_ids:
      - AQ-008
      - AQ-009
      - AQ-020

  - id: PRC-ANT-002
    title: Runtime antenna category thresholds
    domain: classification
    knowledge_status: VERIFIED
    runtime_status: ACTIVE
    statement: "Runtime category thresholds are <=0.6m, <=1.2m, <=1.8m, <=2.4m, otherwise an explicit size category."
    inputs:
      - "Chosen normalized antenna size"
    expected_outcome: "Categories are 0.3/0.6m, 0.9/1.2m, 1.8m, 2.4m, or <size>m."
    risk: HIGH
    source_references:
      - "scripts/generate_tss_pr_ecc.py"
    acceptance_question_ids:
      - AQ-010
    notes: "The skill document's category wording differs; see KB-DIV-002."

  - id: PRC-PLAN-001
    title: All-DU Planning line-item selection
    domain: matching
    knowledge_status: APPROVED
    runtime_status: DOCUMENTED_ONLY
    statement: "Planning PBOM selection depends only on approved DU Model identity and the approved Planning subcontractor value. For GCI/GTSB, 2023 TX Rollout, 2023 Celcomdigi BAU, 2024 Celcomdigi BAU, Celcomdigi USP and Jendela TX Migration select 350001143904; TX Mini Project, MW EOS Swap and ZTE TX MINI select 350001143905. For GCI_AA/GTSB_AA, every supported DU selects only 350001042321. Quantity is 1 and Unit is Hop. TX Planning Remarks, Tx SOW, TX Upgrade Scope, antenna and coordinates must not influence the Planning PBOM."
    inputs:
      - "DU Model"
      - "Subcon Planning / Subcon - Planning"
    expected_outcome: "Exactly one approved Planning PBOM is selected for every eligible supported site."
    exception: "The optional PBOM 350001042321 is explicitly approved for deterministic auto-selection only when Planning subcontractor is GCI_AA or GTSB_AA. It must never be combined with 350001143904 or 350001143905."
    risk: CRITICAL
    source_references:
      - "docs/superpowers/specs/2026-08-11-planning-pr-all-du-design.md"
      - "Info/reference/planning-pr/Planning PR.xlsx (local business evidence)"
    acceptance_question_ids:
      - AQ-025
      - AQ-026
      - AQ-027
      - AQ-029

  - id: PRC-PLAN-002
    title: Planning subcontractor contract identity normalization
    domain: mapping
    knowledge_status: APPROVED
    runtime_status: DOCUMENTED_ONLY
    statement: "Planning contract lookup uses Info/input/contract_info_reference.md. GCI_AA normalizes to contract identity GCI and GTSB_AA normalizes to GTSB. The _AA suffix is preserved as line-item-selection evidence and removed only for contract identity lookup. No Planning-specific contract table is allowed."
    inputs:
      - "Subcon Planning / Subcon - Planning"
      - "Info/input/contract_info_reference.md"
    expected_outcome: "Planning uses the same approved GCI/GTSB contract mapping as other PR scopes without treating _AA as a different subcontractor."
    risk: CRITICAL
    source_references:
      - "docs/superpowers/specs/2026-08-11-planning-pr-all-du-design.md"
      - "Info/input/contract_info_reference.md"
    acceptance_question_ids:
      - AQ-028
      - AQ-032

  - id: PRC-SEL-001
    title: Mandatory line-item selection with approved Planning AA exception
    domain: matching
    knowledge_status: APPROVED
    runtime_status: PARTIAL
    statement: "Automatically generate only deterministic approved line items. TSS/TI must not auto-select optional, choose-one, or transportation items unless separately approved and deterministic. Planning has one explicit optional-item exception: GCI_AA/GTSB_AA deterministically selects optional PBOM 350001042321."
    inputs:
      - "PR Model mandatory flag / group"
      - "Scope"
      - "Planning subcontractor when scope is Planning"
    expected_outcome: "Only deterministic approved rows are produced; the Planning AA exception emits exactly one 350001042321 row."
    exception: "An unresolved mandatory choose-one group remains REVIEW_REQUIRED; no other optional-item auto-selection is authorized by the Planning exception."
    risk: CRITICAL
    source_references:
      - "SKILL.md"
      - "README.md"
      - "docs/superpowers/specs/2026-08-11-planning-pr-all-du-design.md"
    acceptance_question_ids:
      - AQ-007
      - AQ-011
      - AQ-027

  - id: PRC-TI-001
    title: MW Reroute dual install and dismantle logic
    domain: matching
    knowledge_status: EXTRACTED
    runtime_status: ACTIVE
    statement: "MW Reroute requires separately controlled install and dismantle matching; missing or ambiguous antenna data must be review-required."
    inputs:
      - "Tx SOW"
      - "Antenna information"
      - "TI PR Model rows"
    expected_outcome: "Both required components are emitted only when safely matched."
    risk: CRITICAL
    source_references:
      - "README.md"
      - "scripts/generate_tss_pr_ecc.py"
    acceptance_question_ids:
      - AQ-012

  - id: PRC-TI-002
    title: MW Re-engineering manual review boundary
    domain: review
    knowledge_status: EXTRACTED
    runtime_status: ACTIVE
    statement: "MW Re-engineering remains REVIEW_REQUIRED until business rules are confirmed."
    inputs:
      - "Tx SOW"
    expected_outcome: "No automatic PR line is selected for MW Re-engineering."
    risk: CRITICAL
    source_references:
      - "README.md"
      - "SKILL.md"
    acceptance_question_ids:
      - AQ-013

  - id: PRC-MAP-001
    title: Region-to-purchasing-area mapping
    domain: mapping
    knowledge_status: APPROVED
    runtime_status: ACTIVE
    statement: "Purchasing Area is resolved from the controlled Region mapping in Info/input/contract_info_reference.md."
    inputs:
      - "Region"
      - "Info/input/contract_info_reference.md"
    expected_outcome: "Purchasing Area is populated or review-required when unavailable."
    risk: HIGH
    source_references:
      - "README.md"
      - "scripts/generate_tss_pr_ecc.py"
      - "SKILL.md"
      - "Info/input/contract_info_reference.md"
    acceptance_question_ids:
      - AQ-014
    notes: "Issue #34 business confirmation aligns documentation with the existing controlled runtime mapping source; KB-DIV-001 is resolved."

  - id: PRC-MAP-002
    title: Subcontractor-to-contract mapping
    domain: mapping
    knowledge_status: APPROVED
    runtime_status: ACTIVE
    statement: "Contract number is resolved from Info/input/contract_info_reference.md using the applicable normalized subcontractor identity. Planning GCI_AA/GTSB_AA normalize to GCI/GTSB for this lookup. Existing runtime fuzzy matching outside the explicit Planning values remains governed by KB-DIV-003."
    inputs:
      - "Normalized subcontractor name"
      - "Info/input/contract_info_reference.md"
    expected_outcome: "A traceable contract mapping is selected from the controlled reference."
    risk: CRITICAL
    source_references:
      - "README.md"
      - "scripts/generate_tss_pr_ecc.py"
      - "SKILL.md"
      - "Info/input/contract_info_reference.md"
      - "docs/superpowers/specs/2026-08-11-planning-pr-all-du-design.md"
    acceptance_question_ids:
      - AQ-015
      - AQ-028
    notes: "Whether generic fuzzy matches may be emitted without manual review still needs an explicit business decision; see KB-DIV-003. Planning itself permits only GCI, GTSB, GCI_AA and GTSB_AA."

  - id: PRC-OUT-001
    title: ECC required fields and review-preserving output
    domain: output
    knowledge_status: EXTRACTED
    runtime_status: PARTIAL
    statement: "Output rows must populate the ECC template fields from site data, mapping and matched/selected business rule. Missing mandatory data must retain a review record and use REVIEW_REQUIRED; a blocked site must not emit partial ECC."
    inputs:
      - "ECC template"
      - "Site data"
      - "PR model or approved fixed selector"
      - "Mapping reference"
    expected_outcome: "A normal row has blank Remarks; incomplete/blocked sites remain visible through review evidence without partial ECC emission."
    risk: CRITICAL
    source_references:
      - "SKILL.md"
      - "README.md"
      - "scripts/renderer_reconciliation.py"
    acceptance_question_ids:
      - AQ-016
      - AQ-032

  - id: PRC-OUT-002
    title: ECC grouping and split
    domain: output
    knowledge_status: EXTRACTED
    runtime_status: ACTIVE
    statement: "Current TSS and TI outputs are grouped by scope, subcontractor and region, with at most 30 unique Site IDs per output file. Planning is approved to reuse the same grouping contract when implemented."
    inputs:
      - "Scope"
      - "Subcontractor"
      - "Region"
      - "Site ID"
    expected_outcome: "Output groups are split into deterministic files when the 30-site limit is exceeded."
    risk: HIGH
    source_references:
      - "SKILL.md"
      - "README.md"
      - "docs/superpowers/specs/2026-08-11-planning-pr-all-du-design.md"
    acceptance_question_ids:
      - AQ-017

  - id: PRC-OUT-003
    title: ECC output naming
    domain: output
    knowledge_status: EXTRACTED
    runtime_status: ACTIVE
    statement: "Current formal TSS/TI files use <Region>-<Subcontractor> <DU Model> <Scope> PR <YYYYMMDD>.xlsx. Planning is approved to reuse this generic DU Model-aware convention when implemented."
    inputs:
      - "Region"
      - "Subcontractor"
      - "DU Model"
      - "Scope"
      - "Execution date"
    expected_outcome: "Each output file name identifies its group, DU Model and scope."
    risk: MEDIUM
    source_references:
      - "SKILL.md"
      - "README.md"
    acceptance_question_ids:
      - AQ-018

  - id: PRC-OUT-004
    title: ECC source Tx SOW traceability
    domain: output
    knowledge_status: VERIFIED
    runtime_status: ACTIVE
    statement: "ECC Column K remains the matched PR Model description. ECC Column O contains the exact original source Tx SOW for every generated TSS and TI row. ECC Column P remains the Contract Number field. Planning does not use Tx SOW to select its PBOM; any later Planning Column O behavior must be specified without changing TSS/TI semantics."
    inputs:
      - "Matched PR Model description"
      - "Site Tx SOW"
      - "Resolved Contract Number"
    expected_outcome: "Existing TSS/TI rows remain traceable to the original site Tx SOW without altering Column K or Column P meaning."
    risk: HIGH
    source_references:
      - "scripts/generate_tss_pr_ecc.py"
      - "tests/test_ti_sow_matching.py"
    acceptance_question_ids:
      - AQ-024

  - id: PRC-REV-001
    title: Structured review-required reason
    domain: review
    knowledge_status: VERIFIED
    runtime_status: ACTIVE
    statement: "Review-required cases use a normalized reason code, description, required action and technical detail. Blocked sites do not emit partial ECC."
    inputs:
      - "Detected exception"
    expected_outcome: "Review output is actionable rather than a silent zero-row or generic error."
    risk: HIGH
    source_references:
      - "scripts/generate_tss_pr_ecc.py"
      - "scripts/renderer_reconciliation.py"
      - "SKILL.md"
    acceptance_question_ids:
      - AQ-016
      - AQ-019
      - AQ-032

  - id: PRC-ROADMAP-001
    title: Planning implementation and Operation Backoffice roadmap
    domain: roadmap
    knowledge_status: APPROVED
    runtime_status: DOCUMENTED_ONLY
    statement: "Planning business logic is approved for all eight supported DU Models under Issue #34 but is not yet available in the current CLI. Operation Backoffice remains a separate undefined/unsupported future scope and is not part of Issue #34."
    inputs: []
    expected_outcome: "No production user assumes Planning is executable before Issue #34 implementation/regression/UAT is complete, and no Planning implementation accidentally enables Operation Backoffice."
    risk: HIGH
    source_references:
