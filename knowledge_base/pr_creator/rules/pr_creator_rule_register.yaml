knowledge_base:
  id: PR-CREATOR-KB
  title: CelcomDigi TX PR Creator Knowledge Base
  version: 0.2.0
  status: BASELINE_EXTRACTED
  scope: TSS and TI runtime; Planning business rules approved under Issue #34 but runtime-disabled; Operation Backoffice remains future scope
  generated_from_branch: main
  governance_owner_role: TX Program / Business Rule Owner
  technical_owner_role: PR Creator Maintainer
  last_reviewed: "2026-08-11"

