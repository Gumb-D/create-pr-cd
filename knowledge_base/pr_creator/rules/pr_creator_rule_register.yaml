rules:
  - id: PRC-CLI-001
    title: Runtime scope boundary
    domain: runtime
    knowledge_status: VERIFIED
    runtime_status: ACTIVE
    statement: "The current CLI accepts only TSS and TI scope values. Planning business logic is approved under Issue #34 but must remain runtime-disabled until its end-to-end implementation and regression gate passes. Operation Backoffice remains unsupported."
    inputs:
      - --scope
    expected_outcome: "Reject unsupported scopes at argument parsing until each scope is intentionally implemented and enabled."
    risk: LOW
    source_references:
      - "scripts/generate_tss_pr_ecc.py"
      - "README.md"
      - "docs/superpowers/specs/2026-08-11-planning-pr-all-du-design.md"
    acceptance_question_ids:
      - AQ-001

  - id: PRC-ELIG-001
    title: TSS PR eligibility
    domain: eligibility
    knowledge_status: EXTRACTED
    runtime_status: PARTIAL
    statement: "Generate TSS only when a TSS subcontractor is present and no existing TSS PR status or number is present."
    inputs:
      - "SubCon - TSS Team"
      - "TSS PR status / PR number field"
    expected_outcome: "Eligible site-scope combinations proceed to TSS model matching; existing PRs are skipped."
    risk: HIGH
    source_references:
      - "SKILL.md"
    acceptance_question_ids:
      - AQ-002
      - AQ-003

  - id: PRC-ELIG-002
    title: TI PR eligibility
    domain: eligibility
    knowledge_status: EXTRACTED
    runtime_status: PARTIAL
    statement: "Generate TI only when a TI subcontractor is present and no existing TI PR status or number is present."
    inputs:
      - "SubCon - TI Team"
      - "TI PR status / PR number field"
    expected_outcome: "Eligible site-scope combinations proceed to TI model matching; existing PRs are skipped."
    risk: HIGH
    source_references:
      - "SKILL.md"
    acceptance_question_ids:
