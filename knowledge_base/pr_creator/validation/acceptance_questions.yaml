acceptance_set:
  id: PR-CREATOR-ACCEPTANCE
  version: 0.3.0
  generated_from_branch: main
  purpose: "Questions and expected outcomes used for business verification and regression fixture design."

questions:
  - id: AQ-001
    domain: runtime
    rule_ids:
      - PRC-CLI-001
      - PRC-ROADMAP-001
    question: "Which PR scopes are executable through the official create-pr entrypoint?"
    expected: "TSS, TI and Planning are accepted by scripts/create_pr.py. Planning remains subject to DU Profile lifecycle/header/canonical safety gates and Issue #34 regression coverage. Operation Backoffice is rejected as unsupported."
    verification_type: automated_regression

  - id: AQ-002
    domain: eligibility
    rule_ids:
      - PRC-ELIG-001
    question: "If the TSS subcontractor is blank, should a TSS line be generated?"
    expected: "No. The site is not TSS-eligible."
    verification_type: business_fixture

  - id: AQ-003
    domain: duplicate_prevention
    rule_ids:
      - PRC-ELIG-001
      - PRC-ELIG-002
      - PRC-DUP-001
    question: "If the scope-specific PR status/number already exists for the same site, should the generator create another PR?"
    expected: "No. Skip and retain a traceable duplicate-prevention reason."
    verification_type: automated_regression

  - id: AQ-004
    domain: eligibility
    rule_ids:
      - PRC-ELIG-002
    question: "If the TI subcontractor is blank, should a TI line be generated?"
    expected: "No. The site is not TI-eligible."
    verification_type: business_fixture

  - id: AQ-005
    domain: classification
    rule_ids:
      - PRC-SOW-001
    question: "When a Tx SOW contains more than one recognised SOW keyword, which one is primary?"
    expected: "Use only the first identified SOW keyword according to the approved registry/order for scopes that consume Tx SOW. Planning does not consume Tx SOW for PBOM selection."
    verification_type: business_fixture

  - id: AQ-006
    domain: matching
    rule_ids:
      - PRC-MODEL-001
    question: "Can TSS select more than one PR Model group for the same site and SOW?"
    expected: "No. Ambiguous model matches are REVIEW_REQUIRED."
    verification_type: automated_regression

  - id: AQ-007
    domain: line_item
    rule_ids:
      - PRC-MODEL-001
      - PRC-SEL-001
    question: "Which TSS model rows are auto-generated?"
    expected: "Only deterministic approved rows according to the applicable TSS rule; unresolved optional/choose-one rows are not guessed."
    verification_type: automated_regression

  - id: AQ-008
    domain: antenna
    rule_ids:
      - PRC-MODEL-002
      - PRC-ANT-001
    question: "When both NE and FE antenna sizes exist for an antenna-dependent TI model, which size is used for matching?"
    expected: "Use the larger normalized size."
    verification_type: automated_regression

  - id: AQ-009
    domain: antenna
    rule_ids:
      - PRC-MODEL-002
      - PRC-ANT-001
    question: "What happens when an antenna-dependent TI model has incomplete NE/FE antenna data?"
    expected: "REVIEW_REQUIRED; do not silently guess."
    verification_type: automated_regression

  - id: AQ-010
    domain: antenna
    rule_ids:
      - PRC-MODEL-002
      - PRC-ANT-002
    question: "What antenna category should runtime emit for the approved numeric thresholds?"
    expected: "Use the current governed category thresholds and labels; any model-label disagreement remains governed by KB-DIV-002."
    verification_type: automated_regression

  - id: AQ-011
    domain: line_item
    rule_ids:
      - PRC-SEL-001
    question: "May the runtime auto-select arbitrary optional PR Model rows?"
    expected: "No. Optional rows require an explicit deterministic approval. Planning GCI_AA/GTSB_AA -> 350001042321 is one such explicit exception and does not authorize other optional rows."
    verification_type: automated_regression

  - id: AQ-012
    domain: ti
    rule_ids:
      - PRC-TI-001
    question: "How is MW Reroute handled for TI?"
    expected: "Install and dismantle components are controlled separately and emitted only when safely matched."
    verification_type: automated_regression

  - id: AQ-013
    domain: ti
    rule_ids:
      - PRC-TI-002
    question: "Should MW Re-engineering be auto-generated?"
    expected: "No. It remains REVIEW_REQUIRED until business rules are confirmed."
    verification_type: automated_regression

  - id: AQ-014
    domain: mapping
    rule_ids:
      - PRC-MAP-001
    question: "Where does Purchasing Area come from?"
    expected: "From the controlled Region mapping in Info/input/contract_info_reference.md."
    verification_type: mapping_fixture

  - id: AQ-015
    domain: mapping
    rule_ids:
      - PRC-MAP-002
    question: "Where does Contract Number come from?"
    expected: "From the controlled subcontractor mapping in Info/input/contract_info_reference.md using the applicable normalized subcontractor identity."
    verification_type: mapping_fixture

  - id: AQ-016
    domain: output
    rule_ids:
      - PRC-OUT-001
      - PRC-REV-001
    question: "What happens when mandatory output evidence cannot be resolved safely?"
    expected: "The site is blocked from partial ECC output and retained through an actionable REVIEW_REQUIRED/error terminal outcome."
    verification_type: automated_regression

  - id: AQ-017
    domain: output
    rule_ids:
      - PRC-OUT-002
    question: "How many unique Site IDs are allowed per ECC file?"
    expected: "At most 30; split deterministically when necessary."
    verification_type: automated_regression

  - id: AQ-018
    domain: output
    rule_ids:
      - PRC-OUT-003
    question: "What naming contract applies to formal ECC files?"
    expected: "<Region>-<Subcontractor> <DU Model> <Scope> PR <YYYYMMDD>.xlsx, with Part N when split."
    verification_type: automated_regression

  - id: AQ-019
    domain: review
    rule_ids:
      - PRC-REV-001
    question: "Must a review-required outcome carry a structured reason?"
    expected: "Yes. Reason code, explanation and required action must be traceable."
    verification_type: automated_regression

  - id: AQ-020
    domain: antenna
    rule_ids:
      - PRC-ANT-001
    question: "Can an antenna-independent TI model be blocked solely because antenna fields are blank?"
    expected: "No. Only models that actually require antenna selection should require antenna evidence."
    verification_type: automated_regression

  - id: AQ-021
    domain: matching
    rule_ids:
      - PRC-MODEL-002
    question: "Can a TI SOW substring/superset such as BBU Patching Extended match BBU Patching?"
    expected: "No. TI model matching uses canonical exact SOW equality."
    verification_type: automated_regression

  - id: AQ-022
    domain: data
    rule_ids:
      - PRC-DATA-001
    question: "How should Excel integer-like PBOM values ending in .0 be compared?"
    expected: "Canonicalize to the exact integer string without precision loss."
    verification_type: automated_regression

  - id: AQ-023
    domain: tss
    rule_ids:
      - PRC-DATA-001
      - PRC-TSS-001
    question: "What survey PBOM and quantity rules apply to MW New Link / Reroute?"
    expected: "Use the governed deterministic New Link/Reroute PBOM selection, LOS exception and quantity rules."
    verification_type: automated_regression

  - id: AQ-024
    domain: output
    rule_ids:
      - PRC-OUT-004
    question: "How is source Tx SOW traceability represented in ECC output?"
    expected: "TSS/TI preserve the approved source Tx SOW traceability contract. Planning uses its governed Planning description and leaves the source-Tx-SOW column blank because Tx SOW is not a Planning decision input."
    verification_type: automated_regression

  - id: AQ-025
    domain: planning
    rule_ids:
      - PRC-ELIG-003
      - PRC-PLAN-001
      - PRC-ROADMAP-001
    question: "Which DU Models are supported for Planning PR?"
    expected: "Exactly these eight: 2023 TX Rollout, TX Mini Project, 2023 Celcomdigi BAU, 2024 Celcomdigi BAU, Celcomdigi USP, Jendela TX Migration, MW EOS Swap, and ZTE TX MINI."
    verification_type: automated_regression

  - id: AQ-026
    domain: planning
    rule_ids:
      - PRC-PLAN-001
    question: "What Planning PBOM is selected for GCI/GTSB on the five full-planning DU Models?"
    expected: "350001143904, Quantity 1, Unit Hop for 2023 TX Rollout, 2023 Celcomdigi BAU, 2024 Celcomdigi BAU, Celcomdigi USP and Jendela TX Migration."
    verification_type: automated_regression

  - id: AQ-027
    domain: planning
    rule_ids:
      - PRC-PLAN-001
      - PRC-SEL-001
    question: "What Planning PBOM is selected for GCI_AA/GTSB_AA?"
    expected: "For every supported DU, select only 350001042321, Quantity 1, Unit Hop; never also emit 350001143904 or 350001143905."
    verification_type: automated_regression

  - id: AQ-028
    domain: planning
    rule_ids:
      - PRC-PLAN-002
      - PRC-MAP-002
    question: "How are GCI_AA and GTSB_AA mapped for contract lookup?"
    expected: "Normalize to GCI and GTSB respectively only for contract identity; preserve the _AA source value as Planning line-item evidence."
    verification_type: automated_regression

  - id: AQ-029
    domain: planning
    rule_ids:
      - PRC-PLAN-001
    question: "Can Tx SOW, TX Planning Remarks, TX Upgrade Scope, antenna or coordinates change the Planning PBOM?"
    expected: "No. Planning PBOM selection is determined only by approved DU Model identity and Planning subcontractor."
    verification_type: automated_regression

  - id: AQ-030
    domain: planning
    rule_ids:
      - PRC-ELIG-003
    question: "What happens when Planning subcontractor is blank?"
    expected: "No Planning PR is generated; the approved source column must still be mapped so blank is distinguishable from missing evidence."
    verification_type: automated_regression

  - id: AQ-031
    domain: planning
    rule_ids:
      - PRC-ELIG-003
      - PRC-DUP-001
    question: "What happens when the approved Planning PR status/number field is non-blank?"
    expected: "Do not regenerate Planning PR. Existing PR references are duplicate-blocked; explicit No PR required values are ignored."
    verification_type: automated_regression

  - id: AQ-032
    domain: planning
    rule_ids:
      - PRC-ELIG-003
      - PRC-PLAN-002
      - PRC-OUT-001
      - PRC-REV-001
    question: "What safety behavior is required when Planning input, contract, purchasing area, DU identity, or selector evidence cannot be resolved safely?"
    expected: "Fail closed with an actionable terminal review/error outcome, emit no partial Planning ECC for the blocked site, and reconcile every requested site to exactly one terminal disposition."
    verification_type: automated_regression
