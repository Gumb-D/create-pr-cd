acceptance_suite:
  id: PRC-ACCEPTANCE-v0
  status: SPECIFICATION_ONLY
  purpose: "Business questions that will become deterministic regression fixtures before rules are moved from code to configuration."

questions:
  - id: AQ-001
    title: Unsupported scope is rejected
    scenario: "Before Issue #34 runtime enablement, run the CLI with Planning or Operation Backoffice."
    expected: "Argument parsing rejects the scope and states that only TSS and TI are currently supported. Planning may be enabled only after the Issue #34 end-to-end implementation gate; Operation Backoffice remains unsupported."
    priority: P1
    rule_ids:
      - PRC-CLI-001
      - PRC-ROADMAP-001

  - id: AQ-002
    title: TSS site with no subcontractor is not eligible
    scenario: "A site has blank SubCon - TSS Team and no existing TSS PR."
    expected: "No TSS ECC line is generated and the reason is traceable."
    priority: P1
    rule_ids:
      - PRC-ELIG-001

  - id: AQ-003
    title: Existing PR prevents regeneration
    scenario: "A TSS or TI eligible site already contains a PR number or status for the same scope."
    expected: "No duplicate ECC line is generated and the processing summary records the skip."
    priority: P0
    rule_ids:
      - PRC-ELIG-001
      - PRC-ELIG-002
      - PRC-DUP-001

  - id: AQ-004
    title: TI site with no subcontractor is not eligible
    scenario: "A site has blank SubCon - TI Team and no existing TI PR."
    expected: "No TI ECC line is generated and the reason is traceable."
    priority: P1
    rule_ids:
      - PRC-ELIG-002

  - id: AQ-005
    title: Multiple SOW terms select only one primary SOW
    scenario: "Tx SOW includes MW Swap and MW Decom."
    expected: "Exactly one approved primary SOW is used; no secondary scope line is emitted."
    priority: P0
    rule_ids:
      - PRC-SOW-001

  - id: AQ-006
    title: Standard TSS model preserves mandatory model quantities
    scenario: "One eligible TSS site has a single matching mandatory model group that is not subject to a SOW-specific override such as MW New Link / Reroute."
    expected: "Generated mandatory items retain the applicable PR Model quantity; for this standard fixture the quantity is 1, and no optional item is included."
    priority: P0
    rule_ids:
      - PRC-MODEL-001
      - PRC-SEL-001

  - id: AQ-007
    title: Ambiguous mandatory model selection is review-required
    scenario: "Two TSS or TI mandatory model groups match the same evaluated key."
    expected: "No arbitrary model is selected; output is REVIEW_REQUIRED with a specific code."
    priority: P0
    rule_ids:
      - PRC-MODEL-001
      - PRC-MODEL-002
      - PRC-SEL-001

  - id: AQ-008
    title: TI antenna uses the larger size when both sides are complete
    scenario: "NE is 1.2m and FE is 1.8m."
    expected: "The selected category is based on 1.8m and the difference is traceable."
    priority: P0
    rule_ids:
      - PRC-ANT-001
      - PRC-ANT-002
      - PRC-MODEL-002

  - id: AQ-009
    title: Incomplete antenna data blocks only antenna-required TI models
    scenario: "The strictly matched mandatory TI model contains an antenna-dependent choose-one group (for example MW Parallel Link) and one antenna side is blank."
    expected: "The result is REVIEW_REQUIRED, not a normal generated TI model line. This question applies only to antenna-required TI models; antenna-independent SOWs are covered by AQ-020."
    priority: P0
    rule_ids:
      - PRC-ANT-001
      - PRC-MODEL-002

  - id: AQ-010
    title: PR Model category labels align with runtime thresholds
    scenario: "Test antenna sizes 0.3m, 0.6m, 0.9m, 1.2m, 1.8m and 2.4m against the active PR Model."
    expected: "Each size has exactly one approved category and compatible model mapping."
    priority: P0
    rule_ids:
      - PRC-ANT-002

  - id: AQ-011
    title: Unresolved choose-one groups require review
    scenario: "A mandatory PR model group has more than one eligible alternative and no deterministic selector."
    expected: "The generator reports REVIEW_REQUIRED and does not arbitrarily select an item."
    priority: P0
    rule_ids:
      - PRC-SEL-001

  - id: AQ-012
    title: MW Reroute output contains validated install and dismantle logic
    scenario: "A valid MW Reroute site has clear install and decom antenna information."
    expected: "Both approved components are generated; missing or ambiguous values produce review-required."
    priority: P0
    rule_ids:
      - PRC-TI-001

  - id: AQ-013
    title: MW Re-engineering remains blocked from automatic generation
    scenario: "Tx SOW is MW Re-engineering."
    expected: "No automatic normal line is emitted; item is review-required."
    priority: P0
    rule_ids:
      - PRC-TI-002

  - id: AQ-014
    title: Region mapping is deterministic and versioned
    scenario: "Known and unknown region values are processed."
    expected: "Known values resolve to the approved Purchasing Area; unknown values are review-required."
    priority: P0
    rule_ids:
      - PRC-MAP-001

  - id: AQ-015
    title: Fuzzy subcontractor mapping cannot silently misassign a contract
    scenario: "A subcontractor name is similar to more than one reference value."
    expected: "The result follows the approved fuzzy-match policy, exposes score and matched target, and defaults to review when confidence is insufficient."
    priority: P0
    rule_ids:
      - PRC-MAP-002

  - id: AQ-016
    title: Missing mandatory ECC value remains visible for review
    scenario: "A required output field such as Contract Number or Purchasing Area cannot be resolved."
    expected: "The output row is retained and Remarks identifies the missing field and action."
    priority: P0
    rule_ids:
      - PRC-OUT-001
      - PRC-REV-001

  - id: AQ-017
    title: Output group respects the 30 unique Site ID limit
    scenario: "One scope, subcontractor and region group contains 31 unique Site IDs."
    expected: "The generator creates two deterministic output files; neither contains more than 30 unique Site IDs."
    priority: P1
    rule_ids:
      - PRC-OUT-002

  - id: AQ-018
    title: Output filename identifies group and scope
    scenario: "Generate a normal TSS or TI output."
    expected: "Filename follows the approved Region-Subcontractor-DUModel-Scope-date format."
    priority: P2
    rule_ids:
      - PRC-OUT-003

  - id: AQ-019
    title: Review reason is structured and actionable
    scenario: "Trigger a known review-required condition such as missing antenna data."
    expected: "Reason code, description, action and technical detail are populated consistently."
    priority: P1
    rule_ids:
      - PRC-REV-001

  - id: AQ-020
    title: Antenna-independent TI models generate normally with blank or one-sided antenna input
    scenario: "A site has Tx SOW 'BBU Patching' or 'MW IDU Patching' with MW Config Antenna Size NE and FE both blank, or only one side populated."
    expected: "A normal TI ECC line is generated with no REVIEW_REQUIRED remark, because the strictly matched mandatory TI model has no antenna-dependent choose-one group."
    priority: P0
    rule_ids:
      - PRC-ANT-001
      - PRC-MODEL-002

  - id: AQ-021
    title: Strict TI SOW matching rejects supersets and normalizes case and whitespace
    scenario: "Tx SOW values include exact matches with extra whitespace and case variation (for example '  bbu   patching  '), plus unsupported supersets such as 'BBU Patching Extended' and 'MW Parallel Link Extended'."
    expected: "Case- and whitespace-normalized exact matches succeed; supersets and substrings never match and are REVIEW_REQUIRED with a matching-not-found reason."
    priority: P0
    rule_ids:
      - PRC-MODEL-002

  - id: AQ-022
    title: Excel float-formatted PBOM values canonicalize through the real generator path
    scenario: "A PR Model workbook stores a PBOM code as an Excel-derived float such as 350000062773.0."
    expected: "The generated ECC output emits the canonical integer-form PBOM code with no residual '.0' and no digit loss."
    priority: P0
    rule_ids:
      - PRC-DATA-001

  - id: AQ-023
    title: MW New Link / Reroute survey PBOM, quantity, and duplicate controls are deterministic
    scenario: "Generate TSS output for MW New Link and MW Reroute sites, including a Reroute site with a '_LOS' site ID."
    expected: "MW New Link selects PBOM 350000062773 with quantity 1.0 on controlled items; MW Reroute selects PBOM 350000062776 only for '_LOS' sites and otherwise 350000062773, with quantity 1.5 on controlled items; no PBOM code is duplicated in the output."
    priority: P0
    rule_ids:
      - PRC-TSS-001
      - PRC-DATA-001

  - id: AQ-024
    title: ECC Column O carries the source Tx SOW while Column K and Column P keep their intended values
    scenario: "Generate a normal TSS or TI ECC row for a site with a known Tx SOW."
    expected: "Column K contains the matched PR Model description, Column O contains the exact original site Tx SOW, and Column P contains the resolved Contract Number."
    priority: P1
    rule_ids:
      - PRC-OUT-004

  - id: AQ-025
    title: Five full-planning DU Models select PBOM 350001143904
    scenario: "For each of 2023 TX Rollout, 2023 Celcomdigi BAU, 2024 Celcomdigi BAU, Celcomdigi USP and Jendela TX Migration, process an eligible site with Subcon Planning GCI or GTSB and blank Planning PR status."
    expected: "Exactly one Planning line is selected and its PBOM is 350001143904 with quantity 1 and unit Hop."
    priority: P0
    rule_ids:
      - PRC-PLAN-001
      - PRC-ELIG-003

  - id: AQ-026
    title: Remaining three supported DU Models select PBOM 350001143905
    scenario: "For each of TX Mini Project, MW EOS Swap and ZTE TX MINI, process an eligible site with Subcon Planning GCI or GTSB and blank Planning PR status."
    expected: "Exactly one Planning line is selected and its PBOM is 350001143905 with quantity 1 and unit Hop."
    priority: P0
    rule_ids:
      - PRC-PLAN-001
      - PRC-ELIG-003

  - id: AQ-027
    title: AA Planning values select only optional PBOM 350001042321
    scenario: "For every supported DU Model, process otherwise identical eligible sites using GCI_AA and GTSB_AA."
    expected: "Each site generates exactly one Planning item: PBOM 350001042321. PBOM 350001143904 and 350001143905 are absent."
    priority: P0
    rule_ids:
      - PRC-PLAN-001
      - PRC-SEL-001

  - id: AQ-028
    title: AA suffix is removed only for contract identity
    scenario: "Resolve contracts for eligible Planning sites with GCI_AA and GTSB_AA."
    expected: "GCI_AA looks up the GCI contract and GTSB_AA looks up the GTSB contract from Info/input/contract_info_reference.md, while the original _AA value still drives PBOM 350001042321 selection."
    priority: P0
    rule_ids:
      - PRC-PLAN-002
      - PRC-MAP-002

  - id: AQ-029
    title: TX Planning Remarks never changes Planning PBOM selection
    scenario: "Run the same eligible Planning site multiple times with blank, Design, AA-related and arbitrary TX Planning Remarks values while holding DU Model and Subcon Planning constant."
    expected: "The selected Planning PBOM is identical in every case because TX Planning Remarks is not a Planning decision input."
    priority: P0
    rule_ids:
      - PRC-PLAN-001

  - id: AQ-030
    title: Blank Planning subcontractor is ignored
    scenario: "A supported DU site has blank Subcon Planning and blank Planning PR status."
    expected: "No Planning ECC is generated and the terminal outcome records the site as not eligible/ignored rather than silently losing it."
    priority: P0
    rule_ids:
      - PRC-ELIG-003

  - id: AQ-031
    title: Existing Planning PR status prevents duplicate generation
    scenario: "A supported DU site has an approved Planning subcontractor and a non-blank Subcon PR - Planning value, including either a PR number or controlled non-PR status text."
    expected: "No new Planning ECC is generated; duplicate/existing-status handling is traceable in terminal reconciliation."
    priority: P0
    rule_ids:
      - PRC-ELIG-003
      - PRC-DUP-001

  - id: AQ-032
    title: Unknown Planning subcontractor fails closed
    scenario: "A supported DU site has a non-blank Planning subcontractor other than GCI, GTSB, GCI_AA or GTSB_AA and has no existing Planning PR status."
    expected: "The site is REVIEW_REQUIRED with no partial Planning ECC and no fuzzy Planning subcontractor substitution."
    priority: P0
    rule_ids:
      - PRC-ELIG-003
      - PRC-PLAN-002
      - PRC-REV-001
