name: Issue 39 verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Targeted production-gate tests
        run: python -m unittest tests.test_create_pr_entrypoint -v
      - name: Full regression suite
        run: python -m unittest discover -s tests -v
      - name: Syntax and diff checks
        run: |
          python -m py_compile scripts/create_pr.py tests/test_create_pr_entrypoint.py
          git diff --check origin/main...HEAD
