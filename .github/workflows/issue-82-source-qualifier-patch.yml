name: Issue 82 Source Qualifier Patch

on:
  push:
    branches:
      - fix/mw-eos-antenna-evidence
    paths:
      - .github/workflows/issue-82-source-qualifier-patch.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mw-eos-antenna-evidence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Apply source qualifier patch
        shell: python
        run: |
          from pathlib import Path
          path = Path("scripts/antenna_evidence_resolver.py")
          text = path.read_text(encoding="utf-8")
          old = '        rf"(?:(?:size|diameter)\\b[ \\t]*[:=]?[ \\t]*)?{_SOURCE_SIZE_RE}|"\n'
          new = '        rf"(?:(?:(?:with|of)[ \\t]+)?(?:size|diameter)\\b[ \\t]*[:=]?[ \\t]*)?{_SOURCE_SIZE_RE}|"\n'
          if old not in text:
              raise SystemExit("Expected source qualifier line not found; refusing to patch")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Run Issue 82 targeted regression
        run: |
          python -m unittest \
            tests.test_issue_82_mw_eos_antenna \
            tests.test_issue_82_antenna_false_positive \
            tests.test_issue_82_codex_review \
            tests.test_issue_82_legacy_renderer_contract \
            tests.test_issue_82_punctuation_intent \
            tests.test_issue_82_replacement_phrase \
            tests.test_issue_82_direct_cidr \
            tests.test_issue_82_directional_install_wrapper \
            tests.test_issue_82_standalone_replacement \
            tests.test_ti_sow_matching \
            tests.test_human_uat_remediation_48_54 \
            tests.test_jendela_approved_pr_model \
            tests.test_mw_reroute \
            tests.test_pr_safety_controls \
            tests.test_du_profile_loader
      - name: Commit validated resolver patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/antenna_evidence_resolver.py
          git diff --cached --quiet && exit 0
          git commit -m "fix(issue-82): accept governed source qualifiers"
          git push origin HEAD:fix/mw-eos-antenna-evidence
