name: Issue 64 Temporary CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - fix/issue-64-view-independent-du-identity

permissions:
  contents: read

jobs:
  affected-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pyyaml xlrd xlwt
      - name: Check patch whitespace
        run: git diff --check origin/main...HEAD
      - name: Compile changed modules
        run: |
          python -m py_compile \
            scripts/profile_du_export.py \
            scripts/du_profile_resolver.py \
            scripts/du_export_adapter.py \
            scripts/canonical_input_pipeline.py \
            scripts/canonical_generator_bridge_impl.py \
            scripts/canonical_generator_bridge.py \
            scripts/pr_input_guard.py \
            scripts/build_du_discovery_registry.py
      - name: Reject obsolete runtime View errors
        run: |
          if grep -R -n -E 'DU_PROFILE_VIEW_NOT_APPROVED|UNKNOWN_DU_MODEL_OR_VIEW' scripts; then
            echo 'Obsolete View identity error remains in runtime code.' >&2
            exit 1
          fi
      - name: Run affected regression
        run: |
          python -m pytest -q \
            tests/test_issue_64_view_independent_identity.py \
            tests/test_issue_64_pr_guard_project_identity.py \
            tests/test_issue_64_layout_evidence.py \
            tests/test_project_du_model_source_routing.py \
            tests/test_canonical_bridge_profile_routing.py \
            tests/test_du_export_profiler.py \
            tests/test_du_export_adapter.py \
            tests/test_tx_mini_negative_acceptance.py \
            tests/test_tx_mini_tss_ecc_parity.py::TestTxMiniTssEccParity::test_tests_pass_when_reference_exports_absent \
            tests/test_create_pr_entrypoint.py::TestCreatePrEntrypoint::test_resolver_identifies_profile_from_model_view_and_header_hash \
            tests/test_create_pr_entrypoint.py::TestCreatePrEntrypoint::test_unregistered_view_is_runtime_layout_evidence_not_profile_identity

  main-baseline-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pyyaml xlrd xlwt
      - name: Confirm known main baseline failures
        run: |
          set +e
          python -m pytest -q \
            tests/test_create_pr_entrypoint.py::TestCreatePrEntrypoint::test_mark_uat_artifacts_handles_windows_extended_paths \
            tests/test_du_profile_loader.py::TestDuProfileLoader::test_tx_mini_profile_loads_without_claiming_production_readiness \
            tests/test_profile_traceability_audit.py::TestProfileTraceabilityAudit::test_traceability_registry_marks_profile_artifacts_traceable \
            tests/test_run_all_du_ecc_uat.py::TestAllDuEccUat::test_materialize_scope_artifacts_uses_extended_windows_paths \
            tests/test_du_discovery_registry.py \
            > main-baseline.log 2>&1
          status=$?
          set -e
          cat main-baseline.log
          test "$status" -ne 0
          grep -q 'File name too long' main-baseline.log
          grep -q 'No DU profiler artifact root found' main-baseline.log
          grep -q 'TRACEABILITY_REVIEW_REQUIRED' main-baseline.log
          grep -q '1a466e31d3c25ca73f059123d4cc33280761746ea3dca61d25a384acad5c9fde' main-baseline.log

  broad-regression:
    needs:
      - affected-regression
      - main-baseline-evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pyyaml xlrd xlwt
      - name: Run broad regression excluding confirmed main baseline failures
        run: |
          python -m pytest -q \
            --ignore=tests/test_du_discovery_registry.py \
            --deselect=tests/test_create_pr_entrypoint.py::TestCreatePrEntrypoint::test_mark_uat_artifacts_handles_windows_extended_paths \
            --deselect=tests/test_du_profile_loader.py::TestDuProfileLoader::test_tx_mini_profile_loads_without_claiming_production_readiness \
            --deselect=tests/test_profile_traceability_audit.py::TestProfileTraceabilityAudit::test_traceability_registry_marks_profile_artifacts_traceable \
            --deselect=tests/test_run_all_du_ecc_uat.py::TestAllDuEccUat::test_materialize_scope_artifacts_uses_extended_windows_paths
