name: Issue 82 Regression

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/generate_tss_pr_ecc.py"
      - "scripts/antenna_evidence_resolver.py"
      - "scripts/create_pr_impl.py"
      - "config/du_profiles/mw_eos_swap_pr_v1.yaml"
      - "tests/test_issue_82_mw_eos_antenna.py"
      - "tests/test_issue_82_antenna_false_positive.py"
      - "tests/test_issue_82_codex_review.py"
      - ".github/workflows/issue-82-regression.yml"
  push:
    branches:
      - "fix/mw-eos-antenna-evidence"

permissions:
  contents: write

jobs:
  apply-verified-codex-remediation:
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/mw-eos-antenna-evidence')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mw-eos-antenna-evidence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Propagate canonical antenna mapping provenance
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/create_pr_impl.py")
          text = path.read_text(encoding="utf-8")

          columns_old = '''    "FE SOW Details",
    "DU Profile ID",'''
          columns_new = '''    "FE SOW Details",
    "Antenna Evidence Governance",
    "Antenna Size NE Mapping Status",
    "Antenna Size FE Mapping Status",
    "TX SOW Details Mapping Status",
    "NE SOW Details Mapping Status",
    "FE SOW Details Mapping Status",
    "DU Profile ID",'''
          if columns_new not in text:
              if text.count(columns_old) != 1:
                  raise SystemExit(f"renderer column marker count={text.count(columns_old)}; expected 1")
              text = text.replace(columns_old, columns_new, 1)

          helper = '''def _source_mapping_status(record: Mapping[str, Any], canonical_field: str) -> str:
    evidence = record.get("source_evidence", {}).get("fields", {}).get(canonical_field, {})
    if not isinstance(evidence, Mapping):
        return ""
    return str(evidence.get("mapping_status", "") or "").strip().upper()


'''
          marker = 'def _renderer_row(record: Mapping[str, Any]) -> dict[str, Any]:\n'
          if helper not in text:
              if text.count(marker) != 1:
                  raise SystemExit(f"renderer helper marker count={text.count(marker)}; expected 1")
              text = text.replace(marker, helper + marker, 1)

          row_old = '''        "FE SOW Details": technical.get("fe_sow_details", ""),
        "DU Profile ID": record.get("validation", {}).get("profile_id", ""),'''
          row_new = '''        "FE SOW Details": technical.get("fe_sow_details", ""),
        "Antenna Evidence Governance": "CANONICAL_MAPPING_STATUS",
        "Antenna Size NE Mapping Status": _source_mapping_status(record, "antenna_size_ne"),
        "Antenna Size FE Mapping Status": _source_mapping_status(record, "antenna_size_fe"),
        "TX SOW Details Mapping Status": _source_mapping_status(record, "tx_sow_details"),
        "NE SOW Details Mapping Status": _source_mapping_status(record, "ne_sow_details"),
        "FE SOW Details Mapping Status": _source_mapping_status(record, "fe_sow_details"),
        "DU Profile ID": record.get("validation", {}).get("profile_id", ""),'''
          if row_new not in text:
              if text.count(row_old) != 1:
                  raise SystemExit(f"renderer row marker count={text.count(row_old)}; expected 1")
              text = text.replace(row_old, row_new, 1)

          path.write_text(text, encoding="utf-8")
          PY
      - name: Approve only Issue 82 EOS optional antenna evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("config/du_profiles/mw_eos_swap_pr_v1.yaml")
          profile = json.loads(path.read_text(encoding="utf-8"))
          profile["profile_version"] = "0.1.1"
          for field in ("antenna_size_ne", "antenna_size_fe", "tx_sow_details"):
              candidates = profile["field_mapping"][field].get("source_candidates", [])
              if len(candidates) != 1:
                  raise SystemExit(f"{field}: expected exactly one governed source candidate")
              candidates[0]["mapping_status"] = "APPROVED"
          notes = profile.setdefault("validation", {}).setdefault("profile_notes", [])
          approval_note = (
              "Issue #82 optional antenna evidence approval: Human UAT Issue #50 approved "
              "relevant NE/FE antenna fields and TX SOW Details as governed antenna evidence; "
              "the required PR-critical mapping set and mapping_version remain unchanged."
          )
          if approval_note not in notes:
              notes.append(approval_note)
          path.write_text(json.dumps(profile, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Verify Codex remediation and related regressions
        run: |
          python -m unittest \
            tests.test_issue_82_mw_eos_antenna \
            tests.test_issue_82_antenna_false_positive \
            tests.test_issue_82_codex_review \
            tests.test_ti_sow_matching \
            tests.test_human_uat_remediation_48_54 \
            tests.test_mw_reroute \
            tests.test_pr_safety_controls \
            tests.test_du_profile_loader
      - name: Commit verified remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/create_pr_impl.py config/du_profiles/mw_eos_swap_pr_v1.yaml
          if git diff --cached --quiet; then
            echo "No remediation changes to commit."
          else
            git commit -m "fix(issue-82): enforce approved antenna evidence"
            git push origin HEAD:fix/mw-eos-antenna-evidence
          fi
