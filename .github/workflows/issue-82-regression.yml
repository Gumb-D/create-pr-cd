name: Issue 82 Regression

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/generate_tss_pr_ecc.py"
      - "scripts/antenna_evidence_resolver.py"
      - "tests/test_issue_82_mw_eos_antenna.py"
      - ".github/workflows/issue-82-regression.yml"

permissions:
  contents: write

jobs:
  apply-verified-integration:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/mw-eos-antenna-evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mw-eos-antenna-evidence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Apply minimal generator integration
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("scripts/generate_tss_pr_ecc.py")
          text = path.read_text(encoding="utf-8")

          import_marker = "from pr_helpers import ("
          resolver_import = "from antenna_evidence_resolver import resolve_installation_antenna_evidence\n"
          if resolver_import not in text:
              if import_marker not in text:
                  raise SystemExit("Issue 82 import marker not found")
              text = text.replace(import_marker, resolver_import + import_marker, 1)

          pattern = re.compile(
              r'(?P<indent>^[ \t]*)antenna_category, antenna_remark, antenna_size = determine_ti_antenna_category\(\s*'
              r'row\.get\("MW Config Antenna Size NE", ""\),\s*'
              r'row\.get\("MW Config Antenna Size FE", ""\)\s*'
              r'\)',
              re.MULTILINE,
          )
          matches = list(pattern.finditer(text))
          if len(matches) != 1:
              raise SystemExit(f"Issue 82 antenna call structural matches={len(matches)}; expected 1")
          indent = matches[0].group("indent")
          lines = [
              'antenna_resolution = resolve_installation_antenna_evidence(row)',
              'resolved_ne_size = antenna_resolution["ne_size"]',
              'resolved_fe_size = antenna_resolution["fe_size"]',
              'if antenna_resolution["status"] == "RESOLVED_COMMON":',
              '    resolved_ne_size = antenna_resolution["selected_size"]',
              '    resolved_fe_size = antenna_resolution["selected_size"]',
              '',
              'antenna_category, antenna_remark, antenna_size = determine_ti_antenna_category(',
              '    resolved_ne_size,',
              '    resolved_fe_size',
              ')',
              '',
              'if antenna_resolution["status"] in {"RESOLVED", "RESOLVED_COMMON"}:',
              '    evidence_sources = ",".join(',
              '        str(item.get("source", ""))',
              '        for item in antenna_resolution.get("evidence", [])',
              '        if item.get("source")',
              '    )',
              '    _safe_print(',
              '        "[ANTENNA_EVIDENCE]",',
              '        f"site={site_id}",',
              '        f"status={antenna_resolution[\'status\']}",',
              '        f"selected_size={antenna_resolution[\'selected_size\']}",',
              '        f"sources={evidence_sources}",',
              '    )',
          ]
          replacement = "\n".join(indent + line if line else "" for line in lines)
          text = pattern.sub(replacement, text, count=1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Verify patched current tree
        run: |
          python -m unittest \
            tests.test_issue_82_mw_eos_antenna \
            tests.test_ti_sow_matching \
            tests.test_human_uat_remediation_48_54 \
            tests.test_mw_reroute \
            tests.test_pr_safety_controls
      - name: Restore permanent read-only regression workflow
        run: |
          cat > .github/workflows/issue-82-regression.yml <<'YAML'
          name: Issue 82 Regression

          on:
            pull_request:
              branches:
                - main
              paths:
                - "scripts/generate_tss_pr_ecc.py"
                - "scripts/antenna_evidence_resolver.py"
                - "tests/test_issue_82_mw_eos_antenna.py"
                - ".github/workflows/issue-82-regression.yml"

          permissions:
            contents: read

          jobs:
            targeted-regression:
              runs-on: ubuntu-latest
              timeout-minutes: 15
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: "3.12"
                    cache: pip
                - run: python -m pip install -r requirements.txt
                - name: Run Issue 82 and related regressions
                  run: |
                    python -m unittest \
                      tests.test_issue_82_mw_eos_antenna \
                      tests.test_ti_sow_matching \
                      tests.test_human_uat_remediation_48_54 \
                      tests.test_mw_reroute \
                      tests.test_pr_safety_controls
          YAML
      - name: Commit verified integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/generate_tss_pr_ecc.py .github/workflows/issue-82-regression.yml
          git commit -m "fix(issue-82): consume governed antenna evidence"
          git push origin HEAD:fix/mw-eos-antenna-evidence
