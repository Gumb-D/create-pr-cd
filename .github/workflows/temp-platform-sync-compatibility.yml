name: Temporary AI Worker Platform Compatibility

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-platform-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run upstream Issue 69 and related regressions
        run: |
          python -m pip install -r requirements.txt
          python -m unittest \
            tests.test_mw_hardware_upgrade_selection \
            tests.test_mw_hardware_upgrade_selector_boundaries \
            tests.test_ti_sow_matching \
            tests.test_human_uat_remediation_48_54 \
            tests.test_geography_resolver \
            tests.test_mw_reroute \
            tests.test_pr_safety_controls \
            tests.test_tx_mini_golden_parity \
            tests.test_tx_mini_negative_acceptance \
            tests.test_tx_mini_tss_ecc_parity

      - name: Prepare baseline and candidate platform checkouts
        run: |
          git clone --recurse-submodules --branch main \
            https://github.com/DemonTweeks/ai-worker-platform.git platform-baseline
          cp -a platform-baseline platform-candidate
          git -C platform-candidate/skills/create-pr-cd fetch origin 65d45a5ad0891d370f8e1efc24eb6b2a90b77aaf
          git -C platform-candidate/skills/create-pr-cd checkout --detach 65d45a5ad0891d370f8e1efc24eb6b2a90b77aaf

      - name: Apply intended candidate metadata changes
        working-directory: platform-candidate
        run: |
          python - <<'PY'
          from pathlib import Path

          old_version = 'approved-708fb92'
          new_version = 'approved-65d45a5'
          old_commit = '708fb9268c8d8d9ce213c1cb3e837090e9195251'
          new_commit = '65d45a5ad0891d370f8e1efc24eb6b2a90b77aaf'

          replacements = {
              Path('README.md'): [(old_version, new_version), (old_commit, new_commit)],
              Path('backend/scripts/job-service-worker-payload-test.js'): [(old_version, new_version), (old_commit, new_commit)],
              Path('backend/src/workers/manifests/mwPrManifest.js'): [(old_version, new_version), (old_commit, new_commit)],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'{old!r} not found in {path}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8', newline='\n')

          manifest = Path('backend/src/workers/manifests/mwPrManifest.js')
          text = manifest.read_text(encoding='utf-8')
          anchor = "    'scripts/jendela_migration_decision.py',\n"
          addition = "    'scripts/mw_hardware_upgrade_selector.py',\n"
          if addition not in text:
              if anchor not in text:
                  raise SystemExit('runtimeFiles insertion anchor not found')
              text = text.replace(anchor, anchor + addition)
          manifest.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Install platform dependencies
        run: |
          npm ci --prefix platform-baseline/backend
          npm ci --prefix platform-candidate/backend
          npm ci --prefix platform-candidate/frontend

      - name: Compute and apply approved candidate runtime fingerprint
        working-directory: platform-candidate
        shell: bash
        run: |
          set -euo pipefail
          FINGERPRINT="$(node - <<'NODE'
          const path = require('path');
          const manifest = require('./backend/src/workers/manifests/mwPrManifest');
          const { computeRuntimeFingerprint } = require('./backend/src/services/engineIntegrityService');
          process.stdout.write(computeRuntimeFingerprint(path.resolve('skills/create-pr-cd'), manifest.runtimeFiles));
          NODE
          )"
          echo "RUNTIME_FINGERPRINT=${FINGERPRINT}"
          echo "### Runtime fingerprint" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${FINGERPRINT}\`" >> "$GITHUB_STEP_SUMMARY"
          python - "$FINGERPRINT" <<'PY'
          from pathlib import Path
          import re
          import sys

          fingerprint = sys.argv[1]
          if not re.fullmatch(r'[a-f0-9]{64}', fingerprint):
              raise SystemExit(f'Invalid fingerprint: {fingerprint!r}')
          path = Path('backend/src/workers/manifests/mwPrManifest.js')
          text = path.read_text(encoding='utf-8')
          updated, count = re.subn(
              r"runtimeFingerprint: '[a-f0-9]{64}'",
              f"runtimeFingerprint: '{fingerprint}'",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('Expected exactly one runtime fingerprint field')
          path.write_text(updated, encoding='utf-8', newline='\n')
          PY

      - name: Compare integration behavior on old and new engine pins
        shell: bash
        run: |
          set +e
          npm run test:integration --prefix platform-baseline/backend > baseline-integration.log 2>&1
          BASELINE_STATUS=$?
          npm run test:integration --prefix platform-candidate/backend > candidate-integration.log 2>&1
          CANDIDATE_STATUS=$?
          set -e

          echo "BASELINE_INTEGRATION_STATUS=${BASELINE_STATUS}"
          echo "CANDIDATE_INTEGRATION_STATUS=${CANDIDATE_STATUS}"
          echo "--- BASELINE TAIL ---"
          tail -n 40 baseline-integration.log
          echo "--- CANDIDATE TAIL ---"
          tail -n 40 candidate-integration.log

          if [ "${BASELINE_STATUS}" -ne "${CANDIDATE_STATUS}" ]; then
            echo "Candidate integration behavior differs from current platform baseline."
            exit 1
          fi

      - name: Run candidate backend tests excluding known baseline integration result
        working-directory: platform-candidate/backend
        run: |
          npm run smoke
          npm run test:llm-provider
          npm run test:health-status
          npm run test:preflight
          npm run test:engine-integrity
          npm run test:engine-header-hash
          node scripts/error-visibility-test.js
          npm run test:ran-adapter
          npm run test:ran-routes
          npm run test:ran-live-runtime
          npm run test:ran-worker-service
          npm run test:queue-registry
          npm run test:job-control-concurrency
          npm run test:job-prevalidate-guard
          npm run test:job-service-workers

      - name: Run candidate frontend regression suite
        working-directory: platform-candidate
        run: npm test --prefix frontend

      - name: Verify exact engine pin and diff hygiene
        working-directory: platform-candidate
        run: |
          test "$(git -C skills/create-pr-cd rev-parse HEAD)" = "65d45a5ad0891d370f8e1efc24eb6b2a90b77aaf"
          git diff --check
          git status --short
