name: Issue 82 Sized Source Patch

on:
  push:
    branches:
      - fix/mw-eos-antenna-evidence
    paths:
      - .github/workflows/issue-82-from-source-patch.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mw-eos-antenna-evidence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Apply sized governed-source patch
        shell: python
        run: |
          from pathlib import Path

          path = Path("scripts/antenna_evidence_resolver.py")
          text = path.read_text(encoding="utf-8")
          old = '''_ANTENNA_GOVERNED_DIRECTIONAL_ACTION_PATTERN = re.compile(
              r"\\b(?:upgrade|replac(?:e|ed|ing|ement)?|swap(?:ped|ping)?|chang(?:e|ed|ing)?|"
              r"migrat(?:e|ed|ing|ion)?)\\b[ \\t]+(?:from[ \\t]+)?"
              r"(?:(?:the|a|an|existing|old|current|new|target|proposed|replacement|mw|microwave)[ \\t]+)*"
              r"(?:(?:antenna|dish)\\b|"
              r"\\d+(?:[.,]\\d+)?(?:[ \\t]*m(?:eters?|etres?)?\\b)?[ \\t]+(?:antenna|dish)\\b)",
              re.IGNORECASE,
          )'''
          new = '''_SOURCE_MODIFIERS_RE = r"(?:(?:the|a|an|existing|old|current|new|target|proposed|replacement|mw|microwave)[ \\t]+)*"
          _SOURCE_SIZE_RE = r"\\d+(?:[.,]\\d+)?(?:[ \\t]*m(?:eters?|etres?)?\\b)?"
          _SIZED_ANTENNA_SOURCE_RE = (
              rf"(?:{_SOURCE_MODIFIERS_RE}(?:antenna|dish)\\b[ \\t]+"
              rf"(?:(?:size|diameter)\\b[ \\t]*[:=]?[ \\t]*)?{_SOURCE_SIZE_RE}|"
              rf"{_SOURCE_MODIFIERS_RE}{_SOURCE_SIZE_RE}[ \\t]+(?:antenna|dish)\\b)"
          )
          _ANTENNA_GOVERNED_DIRECTIONAL_ACTION_PATTERN = re.compile(
              rf"\\b(?:upgrade|replac(?:e|ed|ing|ement)?|swap(?:ped|ping)?|chang(?:e|ed|ing)?|"
              rf"migrat(?:e|ed|ing|ion)?)\\b[ \\t]+(?:from[ \\t]+)?{_SIZED_ANTENNA_SOURCE_RE}",
              re.IGNORECASE,
          )'''
          if old not in text:
              raise SystemExit("Expected governed-source block not found; refusing to patch")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Run Issue 82 targeted regression
        run: |
          python -m unittest \
            tests.test_issue_82_mw_eos_antenna \
            tests.test_issue_82_antenna_false_positive \
            tests.test_issue_82_codex_review \
            tests.test_issue_82_legacy_renderer_contract \
            tests.test_issue_82_punctuation_intent \
            tests.test_issue_82_replacement_phrase \
            tests.test_issue_82_direct_cidr \
            tests.test_issue_82_directional_install_wrapper \
            tests.test_issue_82_standalone_replacement \
            tests.test_ti_sow_matching \
            tests.test_human_uat_remediation_48_54 \
            tests.test_jendela_approved_pr_model \
            tests.test_mw_reroute \
            tests.test_pr_safety_controls \
            tests.test_du_profile_loader
      - name: Commit validated resolver patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/antenna_evidence_resolver.py
          git diff --cached --quiet && exit 0
          git commit -m "fix(issue-82): require sized governed source phrases"
          git push origin HEAD:fix/mw-eos-antenna-evidence
