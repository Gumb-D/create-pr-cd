name: Issue 77 Promote PR Model v4.1

on:
  push:
    branches:
      - fix/issue-77-jendela-tx-migration-redesign
    paths:
      - .github/workflows/issue-77-promote.yml

permissions:
  contents: write

jobs:
  promote:
    if: github.event.head_commit.message == 'chore(issue-77): trigger v4.1 promotion'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Issue 77 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/issue-77-jendela-tx-migration-redesign

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip openpyxl pandas pyyaml xlrd

      - name: Promote exact reviewed candidate
        run: >-
          python scripts/promote_pr_model.py
          Info/input/pr_model_v4.1.xlsx
          --version 4.1
          --approval config/pr_model_approvals/issue_77_v4_1.json

      - name: Verify candidate and canonical bytes are identical
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          candidate = Path('Info/input/pr_model_v4.1.xlsx').read_bytes()
          canonical = Path('Info/input/pr_model.xlsx').read_bytes()
          expected = '6c4fda502a8998b41bd88704dd6c59d986dc6c46fe42b82947d12c0c0cd8178f'
          assert candidate == canonical, 'candidate and canonical workbook bytes differ'
          assert hashlib.sha256(canonical).hexdigest() == expected, 'canonical SHA mismatch'
          print('ISSUE77_PROMOTION_BYTES_OK=' + expected)
          PY

      - name: Commit promotion result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            Info/input/pr_model.xlsx \
            config/pr_model_baseline.yaml \
            scripts/generate_tss_pr_ecc.py \
            scripts/run_tx_mini_ecc_parity.py \
            tests/test_jendela_approved_pr_model.py
          if git diff --cached --quiet; then
            echo "No promotion changes to commit."
            exit 1
          fi
          git commit -m "chore(issue-77): promote PR Model v4.1"
          git push origin HEAD:fix/issue-77-jendela-tx-migration-redesign
