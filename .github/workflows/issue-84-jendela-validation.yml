name: Issue 84 Jendela Regression Validation

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'config/du_profiles/jendela_tx_migration_pr_v1.yaml'
      - 'tests/test_issue_84_jendela_before_mw_antenna.py'
      - '.github/workflows/issue-84-jendela-validation.yml'

jobs:
  targeted:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Issue 84 targeted regression
        run: python -m unittest tests.test_issue_84_jendela_before_mw_antenna -v
