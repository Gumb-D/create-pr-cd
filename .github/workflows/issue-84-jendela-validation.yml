name: Issue 84 Jendela Regression Validation

on:
  push:
    branches:
      - 'fix/issue-84-jendela-before-mw-antenna'
  pull_request:
    paths:
      - 'scripts/**'
      - 'config/du_profiles/jendela_tx_migration_pr_v1.yaml'
      - 'tests/**'
      - '.github/workflows/issue-84-jendela-validation.yml'

permissions:
  contents: write

jobs:
  apply-legacy-fixture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-84-jendela-before-mw-antenna
          fetch-depth: 0
      - name: Supply before-MW evidence to legacy Jendela cases
        shell: python
        run: |
          from pathlib import Path

          path = Path('tests/test_human_uat_remediation_48_54.py')
          text = path.read_text(encoding='utf-8')
          old = '''    def _decision(self, *, before="Starlink", tx_sow="-", final_backhaul="ignored"):
        record = self.factory.build(
            {
                "tx_before_migration": before,
                "tx_sow_raw": tx_sow,
                "final_backhaul": final_backhaul,
            },
            sow_registry=self.sow_registry,
        )
'''
          new = '''    def _decision(
        self,
        *,
        before="Starlink",
        tx_sow="-",
        final_backhaul="ignored",
        before_mw_config_raw="18G 1.2 SP 1+0",
    ):
        record = self.factory.build(
            {
                "tx_before_migration": before,
                "tx_sow_raw": tx_sow,
                "final_backhaul": final_backhaul,
                "before_mw_config_raw": before_mw_config_raw,
            },
            sow_registry=self.sow_registry,
        )
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one legacy helper, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
      - name: Commit fixture alignment
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_human_uat_remediation_48_54.py
          git commit -m 'test(issue-84): supply before-MW evidence to legacy Jendela cases'
          git push origin HEAD:fix/issue-84-jendela-before-mw-antenna

  targeted:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Issue 84 targeted regression
        run: python -m unittest tests.test_issue_84_jendela_before_mw_antenna -v

  broad-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip openpyxl pandas pyyaml xlrd
      - name: Full repository regression
        run: python -m unittest discover -s tests -p 'test_*.py' -v
