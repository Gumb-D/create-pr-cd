name: Issue 64 Migrate Structural Evidence

on:
  push:
    branches:
      - fix/issue-64-view-independent-du-identity

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-64-view-independent-du-identity
      - name: Replace identity View allowlist dependency
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/profile_du_export.py')
          text = path.read_text(encoding='utf-8')
          old = '''def resolve_approved_header_structure(
              inventory: Mapping[str, Any],
              profile: Mapping[str, Any],
          ) -> Dict[str, str | bool]:
              """Validate exact or View-normalized structure against approved raw hashes.

              Existing approved hashes remain authoritative. For an unseen runtime View,
              the inventory is rebound only at the site identity View suffix to each
              profile-recorded layout View. A match proves the complete layout is otherwise
              byte-for-byte equivalent at the normalized four-header level.
              """
              raw_hash = calculate_header_hash(inventory)
              structural_hash = calculate_structural_header_hash(inventory)
              approved_hashes = {
                  str(value)
                  for value in profile.get("export_structure", {}).get("approved_header_hashes", [])
              }
              if raw_hash in approved_hashes:
                  return {
                      "approved": True,
                      "raw_header_hash": raw_hash,
                      "structural_header_hash": structural_hash,
                      "approved_header_hash": raw_hash,
                      "approval_basis": "RAW_HEADER_HASH",
                  }

              layout_view_ids = {
                  str(value)
                  for value in profile.get("identity", {}).get("accepted_view_ids", [])
                  if str(value).strip()
              }
              for view_id in sorted(layout_view_ids):
                  candidate_hash = _header_hash(inventory, reference_view_id=view_id)
                  if candidate_hash in approved_hashes:
                      return {
                          "approved": True,
                          "raw_header_hash": raw_hash,
                          "structural_header_hash": structural_hash,
                          "approved_header_hash": candidate_hash,
                          "approval_basis": "VIEW_NORMALIZED_TO_APPROVED_LAYOUT",
                      }

              return {
                  "approved": False,
                  "raw_header_hash": raw_hash,
                  "structural_header_hash": structural_hash,
                  "approved_header_hash": "",
                  "approval_basis": "UNAPPROVED_STRUCTURE",
              }
          '''
          new = '''def _approved_site_layout_view_ids(profile: Mapping[str, Any]) -> set[str]:
              """Return layout references from APPROVED site-code mapping evidence."""
              view_ids: set[str] = set()
              site_mapping = profile.get("field_mapping", {}).get("site_code", {})
              for candidate in site_mapping.get("source_candidates", []):
                  if str(candidate.get("mapping_status", "")) != "APPROVED":
                      continue
                  parsed = parse_site_identity_field_code(
                      candidate.get("fingerprint", {}).get("field_code", "")
                  )
                  if parsed is not None:
                      view_ids.add(parsed["view_id"])
              return view_ids


          def resolve_approved_header_structure(
              inventory: Mapping[str, Any],
              profile: Mapping[str, Any],
          ) -> Dict[str, str | bool]:
              """Validate exact or View-normalized structure against approved raw hashes.

              Existing approved hashes remain authoritative. For an unseen runtime View,
              the inventory is rebound only at the site identity View suffix represented
              by an APPROVED site-code mapping fingerprint. Identity accepted_view_ids is
              never consulted. A match proves the complete layout is otherwise identical.
              """
              raw_hash = calculate_header_hash(inventory)
              structural_hash = calculate_structural_header_hash(inventory)
              approved_hashes = {
                  str(value)
                  for value in profile.get("export_structure", {}).get("approved_header_hashes", [])
              }
              if raw_hash in approved_hashes:
                  return {
                      "approved": True,
                      "raw_header_hash": raw_hash,
                      "structural_header_hash": structural_hash,
                      "approved_header_hash": raw_hash,
                      "approval_basis": "RAW_HEADER_HASH",
                  }

              layout_view_ids = _approved_site_layout_view_ids(profile)
              for view_id in sorted(layout_view_ids):
                  candidate_hash = _header_hash(inventory, reference_view_id=view_id)
                  if candidate_hash in approved_hashes:
                      return {
                          "approved": True,
                          "raw_header_hash": raw_hash,
                          "structural_header_hash": structural_hash,
                          "approved_header_hash": candidate_hash,
                          "approval_basis": "VIEW_NORMALIZED_TO_APPROVED_LAYOUT",
                      }

              return {
                  "approved": False,
                  "raw_header_hash": raw_hash,
                  "structural_header_hash": structural_hash,
                  "approved_header_hash": "",
                  "approval_basis": "UNAPPROVED_STRUCTURE",
              }
          '''
          occurrences = text.count(old)
          if occurrences != 1:
              raise SystemExit(f'expected one structural validation block, found {occurrences}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit structural evidence migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/profile_du_export.py
          git commit -m "fix(structure): derive View normalization from approved mapping evidence"
          git push origin HEAD:fix/issue-64-view-independent-du-identity
