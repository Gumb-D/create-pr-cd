name: PR Model Baseline Governance

on:
  pull_request:
    paths:
      - 'config/pr_model_baseline.yaml'
      - 'config/README.md'
      - 'Info/input/pr_model.xlsx'
      - 'scripts/pr_model_baseline.py'
      - 'scripts/analyze_pr_model_change.py'
      - 'scripts/promote_pr_model.py'
      - 'scripts/create_pr.py'
      - 'scripts/generate_tss_pr_ecc.py'
      - 'scripts/run_tx_mini_ecc_parity.py'
      - 'tests/**'
      - 'docs/pr_model_history.md'
      - 'docs/pr_model_reference_inventory.md'
      - '.github/workflows/pr-model-baseline-governance.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  baseline-governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Issue 77 head
        uses: actions/checkout@v4
        with:
          ref: fix/issue-77-jendela-tx-migration-redesign
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install --upgrade pip openpyxl pandas pyyaml xlrd

      - name: Apply and verify global no-output precedence fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def lines(items):
              return "\n".join(items) + "\n"

          impl = Path('scripts/create_pr_impl.py')
          text = impl.read_text(encoding='utf-8')
          start_marker = '        migration_decision = context.get("migration_decision", {})\n'
          end_marker = '        if record.get("validation", {}).get("pr_input_classification") != PR_INPUT_READY:\n'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('create_pr_impl ordering markers not found')
          replacement = lines([
              '        migration_decision = context.get("migration_decision", {})',
              '        jendela_ti_decision = (',
              '            scope == "TI"',
              '            and record.get("validation", {}).get("profile_id") == "jendela_tx_migration_pr_v1"',
              '            and isinstance(migration_decision, Mapping)',
              '        )',
              '        # Global business hard stop always wins, including Jendela plans',
              '        # that are independently classified as intentional no-work.',
              '        if normalization == "APPROVED_NO_OUTPUT":',
              '            set_generation_decision(',
              '                record,',
              '                "IGNORED",',
              '                "APPROVED_NO_OUTPUT",',
              '                "The approved SOW normalization intentionally produces no PR output.",',
              '            )',
              '            partitions["ignored"].append(record)',
              '            continue',
              '        if jendela_ti_decision and migration_decision.get("classification") == "APPROVED_NO_OUTPUT":',
              '            set_generation_decision(',
              '                record,',
              '                "IGNORED",',
              '                str(migration_decision.get("reason_code") or "JENDELA_TI_NO_WORK_REQUIRED"),',
              '                "The approved Jendela TI work plan contains no PR work items.",',
              '            )',
              '            partitions["ignored"].append(record)',
              '            continue',
              '        approved_jendela_ti_decision = (',
              '            jendela_ti_decision',
              '            and migration_decision.get("classification") == "APPROVED"',
              '        )',
          ])
          impl.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

          tests = Path('tests/test_human_uat_remediation_48_54.py')
          text = tests.read_text(encoding='utf-8')
          pattern = re.compile(
              r'    def test_cancel_drop_hard_stop_precedes_migration_output\(self\):\n.*?(?=    def test_empty_jendela_work_plan_is_intentional_no_output\(self\):)',
              re.S,
          )
          replacement = lines([
              '    def test_cancel_drop_hard_stop_precedes_migration_output(self):',
              '        cases = [',
              '            ("Starlink", "APPROVED"),',
              '            ("Fiber Own Build", "APPROVED_NO_OUTPUT"),',
              '        ]',
              '        for before, expected_decision_class in cases:',
              '            with self.subTest(before=before):',
              '                record, decision = self._decision(before=before, tx_sow="Cancel / Drop")',
              '                self.assertEqual(decision["classification"], expected_decision_class)',
              '                partitions = create_pr._partition_records([record], "TI")',
              '                self.assertEqual(partitions["ignored"], [record])',
              '                self.assertEqual(partitions["candidates"], [])',
              '                self.assertEqual(record["pr_generation_decision"]["reason_code"], "APPROVED_NO_OUTPUT")',
              '',
          ])
          updated, count = pattern.subn(lambda _: replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Cancel/Drop test replacement count={count}')
          tests.write_text(updated, encoding='utf-8')
          PY

          python -m py_compile scripts/create_pr_impl.py tests/test_human_uat_remediation_48_54.py
          python -m unittest tests.test_issue_77_jendela_redesign tests.test_human_uat_remediation_48_54.TestJendelaMigrationDecision -v

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- scripts/create_pr_impl.py tests/test_human_uat_remediation_48_54.py
          if git diff --cached --quiet; then
            echo 'No ordering repair changes to commit.'
          else
            git commit -m "fix(issue-77): preserve global no-output precedence"
            git push origin HEAD:fix/issue-77-jendela-tx-migration-redesign
          fi

      - name: Run Issue 75 governance tests
        run: python -m unittest tests.test_pr_model_baseline tests.test_pr_model_change_analyzer tests.test_pr_model_promotion -v

      - name: Run broad regression
        run: python -m unittest discover -s tests -p 'test_*.py' -v
