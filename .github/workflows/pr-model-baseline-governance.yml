name: PR Model Baseline Governance

on:
  pull_request:
    paths:
      - 'config/**'
      - 'Info/input/pr_model.xlsx'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/**'
      - '.github/workflows/pr-model-baseline-governance.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  align-codex-governance-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-84-jendela-before-mw-antenna
          fetch-depth: 0
      - name: Align Jendela current profile and rollback documentation
        shell: python
        run: |
          import re
          from pathlib import Path

          docs = [
              Path('docs/MW_DU_Profile_Readiness_Review.md'),
              Path('docs/MW_DU_Missing_Field_Bridge_Review.md'),
              Path('docs/MW_DU_Profile_Review_Matrix.md'),
              Path('docs/MW_DU_Profile_Traceability_Audit.md'),
              Path('docs/MW_DU_Profile_Rollback_Readiness.md'),
          ]
          section_pattern = re.compile(
              r'(?ms)(^#{2,3} jendela_tx_migration_pr_v1[^\n]*\n.*?^- Profile version: `)0\.4\.0(`)'
          )
          for path in docs:
              text = path.read_text(encoding='utf-8')
              text = section_pattern.sub(r'\g<1>0.5.0\g<2>', text, count=1)
              path.write_text(text, encoding='utf-8')

          rollback = Path('docs/MW_DU_Profile_Rollback_Readiness.md')
          text = rollback.read_text(encoding='utf-8')
          text = text.replace(
              '- Rollback target: `jendela_tx_migration_pr_v1` `0.5.0`',
              '- Rollback target: `jendela_tx_migration_pr_v1` `0.4.0`',
          )
          rollback.write_text(text, encoding='utf-8')

          for path in docs:
              text = path.read_text(encoding='utf-8')
              match = re.search(
                  r'(?ms)^#{2,3} jendela_tx_migration_pr_v1[^\n]*\n(.*?)(?=^#{2,3} |\Z)',
                  text,
              )
              if not match or '- Profile version: `0.5.0`' not in match.group(1):
                  raise SystemExit(f'{path}: Jendela current profile is not 0.5.0')
          if '- Rollback target: `jendela_tx_migration_pr_v1` `0.4.0`' not in rollback.read_text(encoding='utf-8'):
              raise SystemExit('Jendela rollback target must remain prior profile 0.4.0')

      - name: Commit Markdown alignment
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/MW_DU_Profile_Readiness_Review.md docs/MW_DU_Missing_Field_Bridge_Review.md docs/MW_DU_Profile_Review_Matrix.md docs/MW_DU_Profile_Traceability_Audit.md docs/MW_DU_Profile_Rollback_Readiness.md
          if git diff --cached --quiet; then
            echo 'Markdown already aligned.'
            exit 0
          fi
          git commit -m 'docs(issue-84): align Jendela governance snapshot'
          git push origin HEAD:fix/issue-84-jendela-before-mw-antenna

  baseline-governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install --upgrade pip openpyxl pandas pyyaml xlrd

      - name: Run Issue 75 governance tests
        run: python -m unittest tests.test_pr_model_baseline tests.test_pr_model_change_analyzer tests.test_pr_model_promotion -v

      - name: Run broad regression
        run: python -m unittest discover -s tests -p 'test_*.py' -v
