name: PR Model Baseline Governance

on:
  pull_request:
    paths:
      - 'config/pr_model_baseline.yaml'
      - 'config/README.md'
      - 'Info/input/pr_model.xlsx'
      - 'scripts/pr_model_baseline.py'
      - 'scripts/analyze_pr_model_change.py'
      - 'scripts/promote_pr_model.py'
      - 'scripts/create_pr.py'
      - 'scripts/generate_tss_pr_ecc.py'
      - 'scripts/run_tx_mini_ecc_parity.py'
      - 'tests/**'
      - 'docs/pr_model_history.md'
      - 'docs/pr_model_reference_inventory.md'
      - '.github/workflows/pr-model-baseline-governance.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  baseline-governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install --upgrade pip openpyxl pandas pyyaml xlrd

      - name: Promote reviewed v4.1 candidate for Issue 77
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/issue-77-jendela-tx-migration-redesign'
        shell: bash
        run: |
          python scripts/promote_pr_model.py \
            Info/input/pr_model_v4.1.xlsx \
            --version 4.1 \
            --approval config/pr_model_approvals/issue_77_v4_1.json
          python - <<'PY'
          import hashlib
          from pathlib import Path
          candidate = Path('Info/input/pr_model_v4.1.xlsx').read_bytes()
          canonical = Path('Info/input/pr_model.xlsx').read_bytes()
          expected = '6c4fda502a8998b41bd88704dd6c59d986dc6c46fe42b82947d12c0c0cd8178f'
          assert candidate == canonical
          assert hashlib.sha256(canonical).hexdigest() == expected
          print('ISSUE77_PROMOTION_BYTES_OK=' + expected)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            Info/input/pr_model.xlsx \
            config/pr_model_baseline.yaml \
            scripts/generate_tss_pr_ecc.py \
            scripts/run_tx_mini_ecc_parity.py \
            tests/test_jendela_approved_pr_model.py
          if git diff --cached --quiet; then
            echo 'Promotion produced no tracked changes.'
            exit 1
          fi
          git commit -m 'chore(issue-77): promote PR Model v4.1'
          git push origin HEAD:fix/issue-77-jendela-tx-migration-redesign

      - name: Run Issue 75 governance tests
        run: python -m unittest tests.test_pr_model_baseline tests.test_pr_model_change_analyzer tests.test_pr_model_promotion -v

      - name: Run broad regression
        run: python -m unittest discover -s tests -p 'test_*.py' -v
