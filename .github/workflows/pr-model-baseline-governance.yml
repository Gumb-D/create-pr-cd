name: PR Model Baseline Governance

on:
  pull_request:
    paths:
      - 'config/**'
      - 'Info/input/pr_model.xlsx'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/**'
      - '.github/workflows/pr-model-baseline-governance.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-fresh-codex-review:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-84-jendela-before-mw-antenna
          fetch-depth: 0

      - name: Fix Jendela discovery assertion and governance Markdown
        shell: python
        run: |
          import re
          from pathlib import Path

          test_path = Path('tests/test_du_discovery_registry.py')
          text = test_path.read_text(encoding='utf-8')
          old = '''        self.assertEqual(entry["profile_version"], "0.4.0")
        self.assertEqual(entry["mapping_version"], "approved-2026-08-11-jendela-tx-migration-v4")'''
          new = '''        self.assertEqual(entry["profile_version"], "0.5.0")
        self.assertEqual(entry["mapping_version"], "approved-2026-08-11-jendela-tx-migration-v4")'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one stale Jendela discovery assertion, found {text.count(old)}')
          test_path.write_text(text.replace(old, new), encoding='utf-8')

          docs = [
              Path('docs/MW_DU_Profile_Readiness_Review.md'),
              Path('docs/MW_DU_Missing_Field_Bridge_Review.md'),
              Path('docs/MW_DU_Profile_Review_Matrix.md'),
              Path('docs/MW_DU_Profile_Traceability_Audit.md'),
              Path('docs/MW_DU_Profile_Rollback_Readiness.md'),
          ]
          section_pattern = re.compile(
              r'(?ms)(^#{2,3} jendela_tx_migration_pr_v1[^\n]*\n.*?^- Profile version: `)0\.4\.0(`)'
          )
          for path in docs:
              text = path.read_text(encoding='utf-8')
              text, count = section_pattern.subn(r'\g<1>0.5.0\g<2>', text, count=1)
              if count != 1:
                  raise SystemExit(f'{path}: expected one stale Jendela profile-version line, found {count}')
              path.write_text(text, encoding='utf-8')

          rollback = Path('docs/MW_DU_Profile_Rollback_Readiness.md')
          text = rollback.read_text(encoding='utf-8')
          old_target = '- Rollback target: `jendela_tx_migration_pr_v1` `0.5.0`'
          new_target = '- Rollback target: `jendela_tx_migration_pr_v1` `0.4.0`'
          if text.count(old_target) != 1:
              raise SystemExit(f'Rollback report: expected one incorrect current-version target, found {text.count(old_target)}')
          rollback.write_text(text.replace(old_target, new_target), encoding='utf-8')

          for path in docs:
              text = path.read_text(encoding='utf-8')
              if 'approved-2026-08-11-jendela-tx-migration-v4' in text:
                  jendela_match = re.search(
                      r'(?ms)^#{2,3} jendela_tx_migration_pr_v1[^\n]*\n(.*?)(?=^#{2,3} |\Z)',
                      text,
                  )
                  if not jendela_match or '- Profile version: `0.5.0`' not in jendela_match.group(1):
                      raise SystemExit(f'{path}: Jendela v4 report is not paired with profile 0.5.0')
          rollback_text = rollback.read_text(encoding='utf-8')
          if '- Rollback target: `jendela_tx_migration_pr_v1` `0.4.0`' not in rollback_text:
              raise SystemExit('Rollback report no longer points to prior profile 0.4.0')

      - name: Run targeted governance checks
        run: python -m unittest tests.test_du_profile_loader tests.test_profile_rollback_readiness tests.test_missing_field_bridge_review tests.test_profile_traceability_audit tests.test_profile_readiness_review tests.test_profile_review_matrix -v

      - name: Commit Codex review fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_du_discovery_registry.py docs/MW_DU_Profile_Readiness_Review.md docs/MW_DU_Missing_Field_Bridge_Review.md docs/MW_DU_Profile_Review_Matrix.md docs/MW_DU_Profile_Traceability_Audit.md docs/MW_DU_Profile_Rollback_Readiness.md
          git commit -m 'fix(issue-84): align Jendela governance reports and assertions'
          git push origin HEAD:fix/issue-84-jendela-before-mw-antenna

  baseline-governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install --upgrade pip openpyxl pandas pyyaml xlrd

      - name: Run Issue 75 governance tests
        run: python -m unittest tests.test_pr_model_baseline tests.test_pr_model_change_analyzer tests.test_pr_model_promotion -v

      - name: Run broad regression
        run: python -m unittest discover -s tests -p 'test_*.py' -v
