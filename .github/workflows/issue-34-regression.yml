name: Issue 34 Planning Regression

on:
  pull_request:
    branches:
      - main
      - ci/issue-34-validation-base
    paths:
      - "scripts/planning_pr_selector.py"
      - "scripts/planning_pr_runtime.py"
      - "scripts/planning_ecc_renderer.py"
      - "scripts/du_export_adapter.py"
      - "scripts/canonical_site_validator.py"
      - "scripts/canonical_input_pipeline.py"
      - "scripts/create_pr.py"
      - "scripts/create_pr_impl.py"
      - "scripts/pr_input_guard.py"
      - "scripts/pr_safety_controls.py"
      - "scripts/generate_tss_pr_ecc.py"
      - "config/du_profiles/*.yaml"
      - "tests/test_issue_34_planning_*.py"
      - ".github/workflows/issue-34-regression.yml"

permissions:
  contents: read

jobs:
  targeted-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run Issue 34 Planning and safety regressions
        run: |
          python -m unittest \
            tests.test_issue_34_planning_selector \
            tests.test_issue_34_planning_profile_fields \
            tests.test_issue_34_planning_canonical \
            tests.test_issue_34_planning_eligibility \
            tests.test_issue_34_planning_renderer \
            tests.test_issue_34_planning_entrypoint \
            tests.test_du_export_adapter \
            tests.test_du_profile_loader \
            tests.test_create_pr_entrypoint \
            tests.test_create_pr_safety_integration \
            tests.test_issue_74_reconciliation

  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run full repository unittest suite
        run: python -m unittest discover -s tests
