name: Issue 93 Regression

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/main.py"
      - "scripts/create_pr.py"
      - "scripts/create_pr_impl.py"
      - "tests/test_skill_contract.py"
      - "tests/test_issue_93_site_selection.py"
      - ".github/workflows/issue-93-regression.yml"

permissions:
  contents: read

jobs:
  focused-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run Issue 93 requested-site regressions
        run: |
          python -m unittest \
            tests.test_skill_contract \
            tests.test_issue_93_site_selection \
            -v
      - name: Check changed-file whitespace
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
