name: Issue 93 Regression

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/main.py"
      - "scripts/create_pr.py"
      - "scripts/create_pr_impl.py"
      - "tests/test_skill_contract.py"
      - "tests/test_issue_93_site_selection.py"
      - ".github/workflows/issue-93-regression.yml"

permissions:
  contents: read

jobs:
  focused-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run Issue 93 requested-site regressions
        run: |
          python -m unittest \
            tests.test_skill_contract \
            tests.test_issue_93_site_selection \
            -v
      - name: Check changed-file whitespace
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
      - name: Calculate AI Worker Platform package fingerprint
        shell: bash
        run: |
          node <<'NODE'
          const crypto = require('crypto');
          const fs = require('fs');
          const path = require('path');

          const include = [
            'skill.json',
            'requirements.txt',
            'src/**/*.py',
            'scripts/**/*.py',
            'config/**/*.json',
            'config/**/*.yaml',
            'config/**/*.yml',
            'Info/input/pr_model.xlsx',
            'Info/input/ecc_template.xls',
            'Info/input/contract_info_reference.md'
          ];
          const toPosix = (value) => value.split(path.sep).join('/');
          const patternToRegex = (pattern) => {
            const source = toPosix(pattern);
            let regex = '';
            for (let index = 0; index < source.length; index += 1) {
              if (source.slice(index, index + 3) === '**/') {
                regex += '(?:.*/)?';
                index += 2;
              } else if (source.slice(index, index + 2) === '**') {
                regex += '.*';
                index += 1;
              } else if (source[index] === '*') {
                regex += '[^/]*';
              } else {
                regex += source[index].replace(/[.+^${}()|[\]\\]/g, '\\$&');
              }
            }
            return new RegExp(`^${regex}$`);
          };
          const walkFiles = (root, current = root) => {
            const files = [];
            for (const entry of fs.readdirSync(current, { withFileTypes: true })) {
              if (entry.name === '.git' || entry.name === '__pycache__') continue;
              const absolute = path.join(current, entry.name);
              if (entry.isDirectory()) files.push(...walkFiles(root, absolute));
              else if (entry.isFile()) files.push(toPosix(path.relative(root, absolute)));
            }
            return files;
          };
          const matchers = include.map(patternToRegex);
          const files = walkFiles(process.cwd())
            .filter((relative) => matchers.some((matcher) => matcher.test(relative)))
            .sort();
          const packageHash = crypto.createHash('sha256');
          for (const relative of files) {
            const fileHash = crypto.createHash('sha256').update(fs.readFileSync(relative)).digest('hex');
            packageHash.update(relative);
            packageHash.update('\0');
            packageHash.update(fileHash);
            packageHash.update('\n');
          }
          console.log(`PACKAGE_SHA256=${packageHash.digest('hex')}`);
          console.log(`RUNTIME_FILE_COUNT=${files.length}`);
          NODE
