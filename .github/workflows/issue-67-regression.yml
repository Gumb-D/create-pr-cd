name: Issue 67 Regression

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/profile_du_export.py"
      - "tests/test_issue_67_authoritative_header_hash.py"
      - "tests/test_du_export_profiler.py"
      - "tests/test_issue_64_view_independent_identity.py"
      - "tests/test_issue_64_layout_evidence.py"
      - "tests/test_du_export_adapter.py"
      - ".github/workflows/issue-67-regression.yml"

permissions:
  contents: read

jobs:
  targeted-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run Issue 67 and compatibility regressions
        run: |
          python -m unittest \
            tests.test_issue_67_authoritative_header_hash \
            tests.test_du_export_profiler \
            tests.test_issue_64_view_independent_identity \
            tests.test_issue_64_layout_evidence \
            tests.test_du_export_adapter

  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run full unittest suite
        run: python -m unittest discover -s tests -p "test_*.py"
