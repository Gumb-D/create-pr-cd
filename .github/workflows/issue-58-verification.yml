name: Issue 58 Verification

on:
  pull_request:
    branches: [main]

jobs:
  affected-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Compile changed Python modules
        run: >-
          python -m py_compile
          scripts/iepms_export_source_resolver.py
          scripts/du_profile_resolver.py
          scripts/run_all_du_ecc_uat.py
          scripts/canonical_generator_bridge.py
          scripts/canonical_generator_bridge_impl.py
      - name: Project and DU model routing tests
        run: >-
          python -m unittest
          tests/test_project_du_model_source_routing.py
          tests/test_all_du_v2_manifest_completeness.py
          -v
      - name: Canonical bridge profile routing tests
        run: python -m unittest tests/test_canonical_bridge_profile_routing.py -v
      - name: Canonical bridge compatibility tests
        run: python -m unittest tests/test_canonical_generator_bridge.py -v
      - name: Existing resolver compatibility tests
        run: >-
          python -m unittest
          tests.test_create_pr_entrypoint.TestCreatePrEntrypoint.test_resolver_identifies_profile_from_model_view_and_header_hash
          tests.test_create_pr_entrypoint.TestCreatePrEntrypoint.test_unregistered_view_fails_as_profile_error_before_field_access
          tests.test_create_pr_entrypoint.TestCreatePrEntrypoint.test_official_cli_explicit_uat_is_visibly_isolated
          -v
      - name: DU identity governance tests
        run: python -m unittest tests/test_du_profile_identity_governance.py -v
      - name: All-DU runner regression tests
        run: >-
          python -m unittest
          tests.test_run_all_du_ecc_uat.TestAllDuEccUat.test_deterministic_review_sampling_preserves_sow_and_subcontractor_categories
          tests.test_run_all_du_ecc_uat.TestAllDuEccUat.test_manifest_loader_requires_unique_profile_ids
          tests.test_run_all_du_ecc_uat.TestAllDuEccUat.test_master_manifest_initializes_pending_business_status
          tests.test_run_all_du_ecc_uat.TestAllDuEccUat.test_run_batch_isolates_scope_failure_and_reports_blocked_profiles
          tests.test_run_all_du_ecc_uat.TestAllDuEccUat.test_tx_rollout_profile_preserves_mapping_and_approves_both_hashes
          tests/test_run_all_du_ecc_uat_multi_profile.py
          tests/test_all_du_long_path_discovery.py
          -v

  broad-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Full regression excluding confirmed main baselines
        run: |
          python - <<'PY'
          import unittest

          excluded_exact = {
              "test_create_pr_entrypoint.TestCreatePrEntrypoint.test_mark_uat_artifacts_handles_windows_extended_paths",
              "test_run_all_du_ecc_uat.TestAllDuEccUat.test_materialize_scope_artifacts_uses_extended_windows_paths",
          }
          excluded_prefixes = ("test_du_discovery_registry.",)

          def filtered(suite):
              output = unittest.TestSuite()
              for item in suite:
                  if isinstance(item, unittest.TestSuite):
                      nested = filtered(item)
                      if nested.countTestCases():
                          output.addTest(nested)
                  else:
                      test_id = item.id()
                      if test_id in excluded_exact or test_id.startswith(excluded_prefixes):
                          continue
                      output.addTest(item)
              return output

          suite = filtered(
              unittest.defaultTestLoader.discover("tests", pattern="test_*.py")
          )
          count = suite.countTestCases()
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          print(f"FILTERED_TEST_COUNT={count}")
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY

  baseline-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Confirm excluded failures reproduce on main
        shell: bash
        run: |
          set +e
          python -m unittest \
            tests.test_create_pr_entrypoint.TestCreatePrEntrypoint.test_mark_uat_artifacts_handles_windows_extended_paths \
            tests.test_run_all_du_ecc_uat.TestAllDuEccUat.test_materialize_scope_artifacts_uses_extended_windows_paths \
            tests.test_du_discovery_registry \
            -v > baseline.log 2>&1
          status=$?
          set -e
          cat baseline.log
          test "$status" -ne 0
          grep -q "test_mark_uat_artifacts_handles_windows_extended_paths" baseline.log
          grep -q "test_materialize_scope_artifacts_uses_extended_windows_paths" baseline.log
          grep -q "No DU profiler artifact root found" baseline.log
