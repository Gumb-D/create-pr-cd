name: Issue 58 Verification

on:
  pull_request:
    branches: [main]

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Project and DU model routing tests
        run: python -m unittest tests/test_project_du_model_source_routing.py -v
