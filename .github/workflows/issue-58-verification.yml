name: Issue 58 Verification

on:
  pull_request:
    branches: [main]

jobs:
  affected-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Compile changed Python modules
        run: >-
          python -m py_compile
          scripts/iepms_export_source_resolver.py
          scripts/du_profile_resolver.py
          scripts/run_all_du_ecc_uat.py
          scripts/canonical_generator_bridge.py
          scripts/canonical_generator_bridge_impl.py
      - name: Project and DU model routing tests
        run: python -m unittest tests/test_project_du_model_source_routing.py -v
      - name: Canonical bridge profile routing tests
        run: python -m unittest tests/test_canonical_bridge_profile_routing.py -v
      - name: Canonical bridge compatibility tests
        run: python -m unittest tests/test_canonical_generator_bridge.py -v
      - name: Existing resolver compatibility tests
        run: >-
          python -m unittest
          tests.test_create_pr_entrypoint.TestCreatePrEntrypoint.test_resolver_identifies_profile_from_model_view_and_header_hash
          tests.test_create_pr_entrypoint.TestCreatePrEntrypoint.test_unregistered_view_fails_as_profile_error_before_field_access
          tests.test_create_pr_entrypoint.TestCreatePrEntrypoint.test_official_cli_explicit_uat_is_visibly_isolated
          -v
      - name: DU identity governance tests
        run: python -m unittest tests/test_du_profile_identity_governance.py -v
      - name: All-DU runner regression tests
        run: >-
          python -m unittest
          tests.test_run_all_du_ecc_uat.TestAllDuEccUat.test_deterministic_review_sampling_preserves_sow_and_subcontractor_categories
          tests.test_run_all_du_ecc_uat.TestAllDuEccUat.test_manifest_loader_requires_unique_profile_ids
          tests.test_run_all_du_ecc_uat.TestAllDuEccUat.test_master_manifest_initializes_pending_business_status
          tests.test_run_all_du_ecc_uat.TestAllDuEccUat.test_run_batch_isolates_scope_failure_and_reports_blocked_profiles
          tests.test_run_all_du_ecc_uat.TestAllDuEccUat.test_tx_rollout_profile_preserves_mapping_and_approves_both_hashes
          tests/test_run_all_du_ecc_uat_multi_profile.py
          tests/test_all_du_long_path_discovery.py
          -v
