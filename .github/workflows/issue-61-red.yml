name: Issue 61 Verification

on:
  push:
    branches:
      - feat/issue-58-project-du-model-routing
    paths-ignore:
      - docs/verification/**

permissions:
  contents: write

jobs:
  verify-and-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Run RED baseline, targeted tests, and full regression
        shell: bash
        run: |
          set +e

          git worktree add /tmp/issue61-red d17ecde651c9d3a5779526035d2dbce70d76797c
          (
            cd /tmp/issue61-red
            python -m unittest tests/test_cd_consolidation_profile_family.py -v
          ) > /tmp/red.log 2>&1
          red_status=$?

          python -m py_compile \
            scripts/du_profile_loader.py \
            scripts/du_profile_resolver.py \
            scripts/iepms_export_source_resolver.py \
            scripts/run_all_du_ecc_uat.py \
            > /tmp/compile.log 2>&1
          compile_status=$?

          python -m unittest \
            tests/test_cd_consolidation_profile_family.py \
            tests/test_du_profile_identity_governance.py \
            tests/test_du_profile_loader.py \
            tests/test_project_du_model_source_routing.py \
            tests/test_all_du_v2_manifest_completeness.py \
            -v > /tmp/targeted.log 2>&1
          targeted_status=$?

          python -m unittest discover -s tests -p 'test_*.py' -v \
            > /tmp/full.log 2>&1
          full_status=$?

          set -e

          mkdir -p docs/verification
          {
            echo "Issue 61 verification"
            echo "head_sha=$GITHUB_SHA"
            echo "red_baseline_status=$red_status"
            echo "compile_status=$compile_status"
            echo "targeted_status=$targeted_status"
            echo "full_status=$full_status"
            echo
            echo "=== RED tail ==="
            tail -n 30 /tmp/red.log
            echo
            echo "=== TARGETED tail ==="
            tail -n 80 /tmp/targeted.log
            echo
            echo "=== FULL failure summary ==="
            grep -E "^(FAIL|ERROR):|^FAILED|^Ran |^OK|^skipped" /tmp/full.log || true
            echo
            echo "=== FULL tail ==="
            tail -n 120 /tmp/full.log
          } > docs/verification/issue61-verification.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/verification/issue61-verification.txt
          git commit -m "test: record issue 61 verification [skip ci]" || true
          git push origin HEAD:feat/issue-58-project-du-model-routing

          test "$red_status" -ne 0
          test "$compile_status" -eq 0
          test "$targeted_status" -eq 0
          test "$full_status" -eq 0
