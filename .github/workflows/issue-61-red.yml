name: Issue 61 RED

on:
  pull_request:
    branches: [main]

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Confirm consolidation tests fail before implementation
        shell: bash
        run: |
          set +e
          python -m unittest tests/test_cd_consolidation_profile_family.py -v > red.log 2>&1
          status=$?
          set -e
          cat red.log
          test "$status" -ne 0
          grep -Eq "FileNotFoundError|AssertionError" red.log
