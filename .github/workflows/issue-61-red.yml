name: Issue 61 Verification

on:
  pull_request:
    types: [ready_for_review]
    branches: [main]

jobs:
  red-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d17ecde651c9d3a5779526035d2dbce70d76797c
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Confirm pre-implementation tests fail
        shell: bash
        run: |
          set +e
          python -m unittest tests/test_cd_consolidation_profile_family.py -v > red.log 2>&1
          status=$?
          set -e
          cat red.log
          test "$status" -ne 0
          grep -Eq "FileNotFoundError|AssertionError" red.log

  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Compile changed modules
        run: >-
          python -m py_compile
          scripts/du_profile_loader.py
          scripts/du_profile_resolver.py
          scripts/iepms_export_source_resolver.py
          scripts/run_all_du_ecc_uat.py
      - name: Run consolidation and routing tests
        run: >-
          python -m unittest
          tests/test_cd_consolidation_profile_family.py
          tests/test_du_profile_identity_governance.py
          tests/test_du_profile_loader.py
          tests/test_project_du_model_source_routing.py
          tests/test_all_du_v2_manifest_completeness.py
          -v

  full-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Run full repository regression
        run: python -m unittest discover -s tests -p 'test_*.py' -v
