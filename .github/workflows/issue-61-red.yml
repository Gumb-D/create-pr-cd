name: Issue 61 Snapshot

on:
  pull_request:
    types: [ready_for_review]
    branches: [main]

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: issue61-repository-snapshot
          path: |
            .
            !.git
          include-hidden-files: true
          retention-days: 1
