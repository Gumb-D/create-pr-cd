name: Issue 82 Refresh Profile Artifacts

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/issue-82-refresh-artifacts.yml"

permissions:
  contents: write

jobs:
  refresh-profile-artifacts:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/mw-eos-antenna-evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mw-eos-antenna-evidence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Refresh governed MW DU discovery packet
        run: python scripts/refresh_mw_du_discovery_packet.py
      - name: Verify regenerated profile artifacts
        run: |
          python -m unittest \
            tests.test_missing_field_bridge_review \
            tests.test_mw_pair_divergence_review \
            tests.test_du_export_coverage_review \
            tests.test_profile_traceability_audit \
            tests.test_discovery_packet_regeneration
      - name: Commit regenerated registries and docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/registries docs
          if git diff --cached --quiet; then
            echo "No governed artifact changes to commit."
          else
            git commit -m "chore(issue-82): refresh profile governance artifacts"
            git push origin HEAD:fix/mw-eos-antenna-evidence
          fi
