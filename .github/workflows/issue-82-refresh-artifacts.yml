name: Issue 82 Refresh Profile Artifacts

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/issue-82-refresh-artifacts.yml"

permissions:
  contents: write

jobs:
  refresh-profile-artifacts:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/mw-eos-antenna-evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mw-eos-antenna-evidence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt

      - name: Rebuild only the EOS discovery-dependent review entry
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path("scripts").resolve()))
          from build_unresolved_skill_field_review import build_review_entry, review_markdown

          profile = json.loads(Path("config/du_profiles/mw_eos_swap_pr_v1.yaml").read_text(encoding="utf-8"))
          observed_hash = profile["export_structure"]["observed_header_hash"]

          discovery_path = Path("config/registries/mw_du_model_discovery_registry.yaml")
          discovery = json.loads(discovery_path.read_text(encoding="utf-8"))
          eos_discovery = [entry for entry in discovery.get("entries", []) if entry.get("profile_id") == "mw_eos_swap_pr_v1"]
          if not eos_discovery:
              raise SystemExit("EOS discovery entry not found")
          for entry in eos_discovery:
              entry["profile_version"] = profile["profile_version"]
              entry["mapping_version"] = profile["mapping_version"]
              entry["profile_status"] = profile["status"]
          discovery_path.write_text(json.dumps(discovery, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          shortlist = json.loads(Path("config/registries/mw_du_priority_skill_field_shortlists.yaml").read_text(encoding="utf-8"))
          shortlist_entry = next(
              entry for entry in shortlist.get("entries", [])
              if str(entry.get("observed_header_hash", "")) == str(observed_hash)
          )

          unresolved_path = Path("config/registries/mw_du_unresolved_skill_field_review.yaml")
          unresolved = json.loads(unresolved_path.read_text(encoding="utf-8"))
          new_eos = build_review_entry(profile, shortlist_entry)
          replaced = 0
          for index, entry in enumerate(unresolved.get("entries", [])):
              if entry.get("profile_id") == "mw_eos_swap_pr_v1":
                  unresolved["entries"][index] = new_eos
                  replaced += 1
          if replaced != 1:
              raise SystemExit(f"Expected exactly one EOS unresolved entry, found {replaced}")
          unresolved_path.write_text(json.dumps(unresolved, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          Path("docs/MW_DU_Unresolved_Skill_Field_Review.md").write_text(review_markdown(unresolved), encoding="utf-8")

          replacements = {
              Path("tests/test_missing_field_bridge_review.py"): (
                  'self.assertEqual(bridge_entry["profile_version"], "0.1.0")',
                  'self.assertEqual(bridge_entry["profile_version"], "0.1.1")',
              ),
              Path("tests/test_mw_pair_divergence_review.py"): (
                  'self.assertEqual(review["left_profile_version"], "0.1.0")',
                  'self.assertEqual(review["left_profile_version"], "0.1.1")',
              ),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text(encoding="utf-8")
              if new in text:
                  continue
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one EOS assertion marker in {path}, found {text.count(old)}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          readiness_path = Path("tests/test_profile_readiness_review.py")
          readiness = readiness_path.read_text(encoding="utf-8")
          block_start = readiness.index('"mw_eos_swap_pr_v1": {')
          block_end = readiness.index('"tx_rollout_2023_pr_v1": {', block_start)
          eos_block = readiness[block_start:block_end]
          old = '"single": ["antenna_size_fe", "antenna_size_ne", "du_key"],'
          new = '"single": ["du_key"],'
          if new not in eos_block:
              if eos_block.count(old) != 1:
                  raise SystemExit(f"Expected exactly one EOS readiness single-list marker, found {eos_block.count(old)}")
              eos_block = eos_block.replace(old, new, 1)
              readiness = readiness[:block_start] + eos_block + readiness[block_end:]
              readiness_path.write_text(readiness, encoding="utf-8")
          PY

      - name: Rebuild downstream tracked-input governance packet
        run: |
          python scripts/build_missing_field_bridge_review.py
          python scripts/build_mw_pair_divergence_review.py
          python scripts/build_profile_readiness_review.py
          python scripts/build_profile_action_queue.py
          python scripts/build_profile_review_matrix.py
          python scripts/build_du_export_coverage_review.py
          python scripts/build_profile_transition_review.py
          python scripts/build_profile_deprecation_review.py
          python scripts/build_profile_rollback_readiness.py
          python scripts/build_profile_traceability_audit.py

      - name: Verify regenerated packet consistency
        run: |
          python scripts/check_discovery_packet_consistency.py
          python -m unittest \
            tests.test_unresolved_skill_field_review \
            tests.test_missing_field_bridge_review \
            tests.test_mw_pair_divergence_review \
            tests.test_profile_readiness_review \
            tests.test_profile_action_queue \
            tests.test_profile_review_matrix \
            tests.test_du_export_coverage_review \
            tests.test_profile_transition_review \
            tests.test_profile_deprecation_review \
            tests.test_profile_rollback_readiness \
            tests.test_profile_traceability_audit

      - name: Commit regenerated EOS governance packet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/registries docs tests/test_missing_field_bridge_review.py tests/test_mw_pair_divergence_review.py tests/test_profile_readiness_review.py
          if git diff --cached --quiet; then
            echo "No governed artifact changes to commit."
          else
            git commit -m "chore(issue-82): sync EOS profile governance artifacts"
            git push origin HEAD:fix/mw-eos-antenna-evidence
          fi
