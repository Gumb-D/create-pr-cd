name: Issue 69 Regression

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/**"
      - "tests/test_mw_hardware_upgrade_selection.py"
      - ".github/workflows/issue-69-regression.yml"

permissions:
  contents: read

jobs:
  targeted-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest tests.test_mw_hardware_upgrade_selection
