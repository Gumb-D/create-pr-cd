name: Issue 69 Integration

on:
  push:
    branches:
      - fix/issue-69-mw-hardware-upgrade-selection

permissions:
  contents: write

jobs:
  integrate-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-69-mw-hardware-upgrade-selection
          fetch-depth: 0
      - name: Apply generator integration
        run: |
          git apply --check .github/issue-69-generator.patch
          git apply .github/issue-69-generator.patch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run Issue 69 and related regressions
        run: |
          python -m unittest \
            tests.test_mw_hardware_upgrade_selection \
            tests.test_ti_sow_matching \
            tests.test_human_uat_remediation_48_54 \
            tests.test_geography_resolver \
            tests.test_mw_reroute \
            tests.test_pr_safety_controls \
            tests.test_tx_mini_golden_parity \
            tests.test_tx_mini_negative_acceptance \
            tests.test_tx_mini_tss_ecc_parity
      - name: Commit integrated generator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/generate_tss_pr_ecc.py
          git commit -m "fix(issue-69): integrate hardware upgrade selector"
          git push origin HEAD:fix/issue-69-mw-hardware-upgrade-selection
