name: Issue 62 Finalize

on:
  push:
    branches:
      - feat/issue-62-tx-mini-production

permissions:
  contents: write

jobs:
  finalize:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/issue-62-tx-mini-production

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: python -m pip install --upgrade pip; python -m pip install -r requirements.txt

      - name: Synchronize TX Mini lifecycle governance
        shell: pwsh
        run: |
          @'
          import json
          import re
          from pathlib import Path

          PROFILE_ID = "tx_mini_pr_v1"

          def synchronize(value):
              changed = False
              if isinstance(value, dict):
                  if value.get("profile_id") == PROFILE_ID:
                      for key in ("profile_status", "current_status"):
                          if key in value and value[key] != "PRODUCTION":
                              value[key] = "PRODUCTION"
                              changed = True

                      blockers = value.get("blocker_summary")
                      if isinstance(blockers, dict):
                          for key in ("overall_blockers", "lifecycle_blockers"):
                              reasons = blockers.get(key)
                              if isinstance(reasons, list) and "PROFILE_NOT_PRODUCTION" in reasons:
                                  blockers[key] = [
                                      reason for reason in reasons
                                      if reason != "PROFILE_NOT_PRODUCTION"
                                  ]
                                  changed = True

                      for target in value.get("transition_targets", []):
                          if (
                              isinstance(target, dict)
                              and target.get("target_status") == "PRODUCTION"
                          ):
                              if target.get("eligible") is not True:
                                  target["eligible"] = True
                                  changed = True
                              if target.get("denied_reasons") != []:
                                  target["denied_reasons"] = []
                                  changed = True

                  for nested in value.values():
                      if synchronize(nested):
                          changed = True
              elif isinstance(value, list):
                  for nested in value:
                      if synchronize(nested):
                          changed = True
              return changed

          for path in sorted(Path("config/registries").glob("*.yaml")):
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except (UnicodeDecodeError, json.JSONDecodeError):
                  continue
              if synchronize(data):
                  path.write_text(
                      json.dumps(data, ensure_ascii=False, indent=2) + "\n",
                      encoding="utf-8",
                  )
                  print(f"Updated {path}")

          section_pattern = re.compile(
              r"(^## tx_mini_pr_v1\b.*?)(?=^## |\Z)",
              flags=re.MULTILINE | re.DOTALL,
          )

          def update_section(match):
              section = match.group(1)
              section = section.replace("`PR_INPUT_READY`", "`PRODUCTION`")
              section = section.replace(
                  "- `PRODUCTION`: `DENIED` because `PROFILE_NOT_PRODUCTION`",
                  "- `PRODUCTION`: `ELIGIBLE`",
              )
              section = section.replace(
                  "- Overall blockers: `PROFILE_NOT_PRODUCTION`",
                  "- Overall blockers: ``",
              )
              return section

          for path in sorted(Path("docs").glob("MW_DU_*.md")):
              text = path.read_text(encoding="utf-8")
              updated = section_pattern.sub(update_section, text)
              if updated != text:
                  path.write_text(updated, encoding="utf-8")
                  print(f"Updated {path}")
          '@ | python -

      - name: Run targeted lifecycle tests
        shell: pwsh
        run: |
          python -m unittest `
            tests.test_create_pr_entrypoint `
            tests.test_profile_status_consistency `
            tests.test_profile_readiness_review

      - name: Run governance consistency checks
        shell: pwsh
        run: |
          python scripts/check_profile_status_consistency.py
          python scripts/check_discovery_packet_consistency.py

      - name: Run full regression suite
        shell: pwsh
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Commit verified synchronization and remove temporary workflow
        shell: pwsh
        run: |
          Remove-Item ".github/workflows/issue-62-finalize.yml" -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          $Changes = git status --porcelain
          if ($Changes) {
            git commit -m "chore(profile): synchronize TX Mini production governance"
            git push origin HEAD:feat/issue-62-tx-mini-production
          }
