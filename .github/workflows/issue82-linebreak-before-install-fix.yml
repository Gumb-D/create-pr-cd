name: Issue 82 Unified Multiline Target Patch

on:
  push:
    branches:
      - fix/mw-eos-antenna-evidence
    paths:
      - ".github/workflows/issue82-linebreak-before-install-fix.yml"

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mw-eos-antenna-evidence
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Apply unified multiline install-target guard
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/antenna_evidence_resolver.py")
          text = path.read_text(encoding="utf-8")
          old = '''_BROKEN_MULTILINE_INSTALL_TARGET_PATTERN = re.compile(
    rf"\\b(?:with|by|to)\\b{_HWS1_RE}install(?:ed|ing)?"
    rf"(?:{_HWS1_RE}(?:a|an|the|new|target|proposed|replacement)){{0,2}}{_HWS_RE}"
    rf"(?:\\r\\n|\\r|\\n)"
    rf"(?={_HWS_RE}(?:(?:a|an|the|new|target|proposed|replacement){_HWS1_RE}){{0,2}}(?:antenna|dish)\\b)",
    re.IGNORECASE,
)'''
          new = '''_BROKEN_MULTILINE_INSTALL_TARGET_PATTERN = re.compile(
    rf"\\b(?:with|by|to)\\b"
    rf"(?=[ \\t\\r\\n]{{1,80}}(?:\\r\\n|\\r|\\n))"
    rf"[ \\t\\r\\n]+install(?:ed|ing)?"
    rf"(?:[ \\t\\r\\n]+(?:a|an|the))?"
    rf"(?:[ \\t\\r\\n]+(?:new|target|proposed|replacement))?"
    rf"[ \\t\\r\\n]+(?:antenna|dish)\\b",
    re.IGNORECASE,
)'''
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one old multiline guard, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Run Issue 82 targeted regression
        run: |
          python -m unittest \
            tests.test_issue_82_mw_eos_antenna \
            tests.test_issue_82_antenna_false_positive \
            tests.test_issue_82_codex_review \
            tests.test_issue_82_legacy_renderer_contract \
            tests.test_issue_82_punctuation_intent \
            tests.test_issue_82_replacement_phrase \
            tests.test_issue_82_direct_cidr \
            tests.test_issue_82_directional_install_wrapper \
            tests.test_ti_sow_matching \
            tests.test_human_uat_remediation_48_54 \
            tests.test_jendela_approved_pr_model \
            tests.test_mw_reroute \
            tests.test_pr_safety_controls \
            tests.test_du_profile_loader
      - name: Commit validated resolver patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/antenna_evidence_resolver.py
          git diff --cached --quiet && exit 0
          git commit -m "fix(issue-82): unify multiline install-target guard"
          git push origin HEAD:fix/mw-eos-antenna-evidence

# Trigger validation after workflow exists on branch.
